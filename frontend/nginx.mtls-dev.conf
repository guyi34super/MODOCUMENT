# LOCAL DEVELOPMENT ONLY (Wave 4): the mTLS API listener of
# docker-compose.mtls-dev.yml, standing in for the AWS ALB's api.<domain>
# mutual-TLS listener in verify mode (infra/terraform/modules/ecs-app/mtls.tf).
# Never part of an image: compose mounts it into a stock unprivileged nginx
# as /etc/nginx/templates/default.conf.template, rendered by envsubst at
# start (NGINX_ENVSUBST_FILTER=^MODOCUMENT_). Substituted: MODOCUMENT_API_UPSTREAM,
# MODOCUMENT_PUBLIC_HOST and MODOCUMENT_NGX_MTLS_* (set by the compose file;
# LEAF = the trusted-only map below, the others cleared). Every other $name
# is an nginx variable.
#
# Certificates: scripts/dev-mtls-certs.sh (a throwaway dev CA generated at
# runtime, never committed). Guide: docs/integration/developer-guide.md,
# "Local mTLS listener".
#
# Like the ALB, this proxy VERIFIES the client certificate against the dev CA
# and passes only a verified leaf on, as X-Amzn-Mtls-Clientcert-Leaf
# (URL-encoded PEM, $ssl_client_escaped_cert). `optional` lets a caller
# without a certificate through (enrolment, client-secret clients), with the
# header cleared. A certificate that fails verification is refused by nginx
# (400). The app trusts the header only from 127.0.0.1: this nginx shares the
# app container's network namespace, like the frontend sidecar on ECS.

# --- Security headers on PROXIED responses: the same fallbacks as
# frontend/nginx.conf (only for responses nginx generates itself).
map $upstream_http_content_security_policy $api_csp_fallback {
    ""      "default-src 'none'; frame-ancestors 'none'";
    default "";
}
map $upstream_http_x_content_type_options $api_nosniff_fallback {
    ""      "nosniff";
    default "";
}
map $upstream_http_x_frame_options $api_xfo_fallback {
    ""      "DENY";
    default "";
}
map $upstream_http_referrer_policy $api_referrer_fallback {
    ""      "no-referrer";
    default "";
}

# The verified leaf only; NONE / FAILED:<reason> = no header at all.
map $ssl_client_verify $modocument_dev_mtls_leaf {
    default  "";
    SUCCESS  $ssl_client_escaped_cert;
}

server {
    listen 8443 ssl;
    server_tokens off;
    client_max_body_size 200m;
    # The URL-encoded leaf certificate makes for a long header.
    large_client_header_buffers 4 16k;

    ssl_certificate         /etc/nginx/mtls/server.crt;
    ssl_certificate_key     /etc/nginx/mtls/server.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_client_certificate  /etc/nginx/mtls/ca.crt;
    ssl_verify_client       optional;
    ssl_verify_depth        2;

    location = /nginx-health {
        default_type text/plain;
        include snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Machine routes only, as on the ALB's api.<domain> listener.
    location ~ ^/api/(integration|agent)/ {
        proxy_pass http://${MODOCUMENT_API_UPSTREAM};
        proxy_set_header Host ${MODOCUMENT_PUBLIC_HOST};
        # This proxy is the edge: overwrite, never append (SEC-022).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host ${MODOCUMENT_PUBLIC_HOST};
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        # Client-certificate identity: what THIS proxy verified, never a
        # header the caller sent (verify-mode ALB contract).
        proxy_set_header X-Amzn-Mtls-Clientcert "";
        proxy_set_header X-Amzn-Mtls-Clientcert-Serial-Number ${MODOCUMENT_NGX_MTLS_SERIAL};
        proxy_set_header X-Amzn-Mtls-Clientcert-Issuer ${MODOCUMENT_NGX_MTLS_ISSUER};
        proxy_set_header X-Amzn-Mtls-Clientcert-Subject ${MODOCUMENT_NGX_MTLS_SUBJECT};
        proxy_set_header X-Amzn-Mtls-Clientcert-Validity ${MODOCUMENT_NGX_MTLS_VALIDITY};
        proxy_set_header X-Amzn-Mtls-Clientcert-Leaf ${MODOCUMENT_NGX_MTLS_LEAF};
        proxy_read_timeout 120s;

        add_header Content-Security-Policy $api_csp_fallback always;
        add_header X-Content-Type-Options $api_nosniff_fallback always;
        add_header X-Frame-Options $api_xfo_fallback always;
        add_header Referrer-Policy $api_referrer_fallback always;
    }

    location / {
        include snippets/security-headers.conf;
        return 404;
    }
}
