# Security headers for everything nginx serves FROM DISK: the SPA shell
# (index.html), its hashed /assets bundles, and the SPA fallback (E1).
# Installed as /etc/nginx/snippets/security-headers.conf (frontend/Dockerfile)
# and `include`d by every static location in nginx.conf.
#
# WHY A SNIPPET: nginx's add_header is inherited only by blocks that define
# NO add_header of their own — one add_header in a location silently drops
# every server-level header for that location. Each static location
# therefore includes this file explicitly, and scripts/check-nginx-headers.sh
# (CI, frontend job) fails the build when a location serving content lacks
# it. Proxied API locations are different on purpose — see nginx.conf.
#
# "always" = also on 4xx/5xx responses nginx generates itself.
# Inventory + rationale: docs/security/web-hardening.md.

# CSP tailored to the built app (verified against `npm run build` output):
#   script-src 'self'   Vite emits hashed same-origin module chunks under
#                       /assets/ (v1.2.0: an entry chunk, a `vendor` chunk
#                       and one lazy chunk per route page, loaded by
#                       dynamic import() and <link rel="modulepreload">);
#                       index.html has NO inline script, no chunk uses eval.
#   style-src 'self'    The only stylesheet is the hashed Tailwind bundle via
#                       <link>. NO 'unsafe-inline': React applies the `style`
#                       prop through the CSSOM (element.style[...] = …),
#                       which CSP does not govern, and nothing renders a
#                       <style> element or a style="" attribute in markup.
#   img-src data: blob: the TOTP enrollment QR code is rendered client-side
#                       to a data: URL (qrcode.toDataURL, canvas — no remote
#                       service); AuthedImage shows Bearer-fetched images
#                       through blob: object URLs.
#   connect-src 'self'  the SPA only calls its own origin (/api et al. are
#                       proxied by this nginx); no remote origins anywhere.
#   font-src 'self'     system font stack today; same-origin fonts allowed.
#   frame-ancestors 'none' / object-src 'none' / base-uri 'self' /
#   form-action 'self'  no framing, no plugins, no <base> hijack, forms
#                       post only to this origin.
# Deliberately NOT set: upgrade-insecure-requests (would break plain-HTTP
# local dev on http://localhost:3000; production is HTTPS end to end anyway).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# HSTS is honoured by browsers ONLY when received over HTTPS: inert on
# plain-HTTP local dev, effective behind the production TLS terminator.
# No `preload` — that is a one-way, domain-wide decision for the operator.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
