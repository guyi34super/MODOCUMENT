# Runs in the unprivileged nginx image (frontend/Dockerfile): master and
# workers run as a non-root user and listen on 8080 (SUP-S04); compose maps
# host 3000 -> 8080. This file is installed as a template and rendered into
# conf.d/default.conf (i.e. inside nginx's http {} block) at container start;
# the only substituted variable is MODOCUMENT_API_UPSTREAM (see
# frontend/Dockerfile) — every other $name below is an nginx variable.

# --- Security headers on PROXIED responses (E1) ---------------------------
# The backend sets its own, stricter header set on every API response
# (SecurityConfig: CSP default-src 'none'; frame-ancestors 'none', nosniff,
# X-Frame-Options, Referrer-Policy, Cache-Control no-store, HSTS behind
# X-Forwarded-Proto: https), pinned by HeaderContractTest. nginx must NOT
# add a second copy: add_header APPENDS (two CSP headers are enforced as
# their intersection and flagged by scanners). But responses nginx produces
# itself on these paths — 413 body too large, 502/504 while the app is
# down or slow — never reach the backend and would go out bare. These maps
# emit the API set ONLY when the upstream response did not carry the header
# (empty value = add_header emits nothing).
map $upstream_http_content_security_policy $api_csp_fallback {
    ""      "default-src 'none'; frame-ancestors 'none'";
    default "";
}
map $upstream_http_x_content_type_options $api_nosniff_fallback {
    ""      "nosniff";
    default "";
}
map $upstream_http_x_frame_options $api_xfo_fallback {
    ""      "DENY";
    default "";
}
map $upstream_http_referrer_policy $api_referrer_fallback {
    ""      "no-referrer";
    default "";
}

server {
    listen 8080;

    # Don't advertise the nginx version in the Server header or on error
    # pages (E1).
    server_tokens off;

    # Matches the backend's multipart max-request-size (bulk image uploads).
    client_max_body_size 200m;

    # Both API path families go to Spring Boot; the ingestion pipeline runs
    # synchronously, so allow long reads.
    # oauth2|login/oauth2: the OIDC handshake endpoints (ws07) — Spring
    # Security's authorization redirect + provider callback. /login itself
    # (without /oauth2) stays a SPA route.
    location ~ ^/(api|oauth2|login/oauth2|Templates|TemplateFields|TemplateDataTypes|ValidationRules|Validation|ImportHistory|ImportDetails|ProcessStep)(/|$) {
        # The API upstream: `app:8080` (compose service) unless the
        # container's MODOCUMENT_API_UPSTREAM says otherwise (ECS awsvpc
        # task: 127.0.0.1:<app port>). Rendered at start by envsubst.
        proxy_pass http://${MODOCUMENT_API_UPSTREAM};
        proxy_set_header Host $host;
        # Trusted-proxy contract (pairs with server.forward-headers-strategy:
        # framework in application.yml): OVERWRITE the forwarding headers with
        # this proxy's own view of the connection. Never use
        # $proxy_add_x_forwarded_for here — it APPENDS to whatever the client
        # sent, letting any caller plant the first hop the app trusts for
        # per-IP rate limiting and audit IPs. X-Forwarded-Proto: https makes
        # the app emit HSTS; with the $scheme overwrite that happens when TLS
        # terminates AT this nginx. Terminating at an outer balancer instead?
        # Forward ITS X-Forwarded-* here verbatim (it then overwrites the
        # client's values) rather than this proxy's own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;

        # API header set: the backend's own; the fallbacks (maps above) fill
        # in only for responses nginx generated itself. No SPA snippet here.
        add_header Content-Security-Policy $api_csp_fallback always;
        add_header X-Content-Type-Options $api_nosniff_fallback always;
        add_header X-Frame-Options $api_xfo_fallback always;
        add_header Referrer-Policy $api_referrer_fallback always;
    }

    # SPA fallback: every other route serves the React app (index.html and
    # the hashed /assets bundles) — with the full SPA security header set.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        include snippets/security-headers.conf;
    }
}
