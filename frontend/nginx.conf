# Runs in the unprivileged nginx image (frontend/Dockerfile): master and
# workers run as a non-root user and listen on 8080 (SUP-S04); compose maps
# host 3000 -> 8080. This file is installed as a template and rendered into
# conf.d/default.conf (i.e. inside nginx's http {} block) at container start.
# Substituted variables: MODOCUMENT_API_UPSTREAM and MODOCUMENT_PUBLIC_HOST
# (see frontend/Dockerfile) and the MODOCUMENT_NGX_FORWARDED_* and
# MODOCUMENT_NGX_MTLS_* values DERIVED by
# frontend/docker-entrypoint.d/19-modocument-trusted-proxy.envsh from the
# proxy mode (never set them yourself — that script overwrites them). Every
# other $name below is an nginx variable.
#
# Two servers: 8080 for browsers and every API call (it ALWAYS strips the
# ALB's X-Amzn-Mtls-Clientcert-* headers), and 8443, the ws26 mTLS API
# server behind the ALB's optional api.<domain> mutual-TLS listener
# (infra/terraform/modules/ecs-app/mtls.tf) — the only place those headers
# reach the app, and only from the trusted ALB.

# --- Security headers on PROXIED responses (E1) ---------------------------
# The backend sets its own, stricter header set on every API response
# (SecurityConfig: CSP default-src 'none'; frame-ancestors 'none', nosniff,
# X-Frame-Options, Referrer-Policy, Cache-Control no-store, HSTS behind
# X-Forwarded-Proto: https), pinned by HeaderContractTest. nginx must NOT
# add a second copy: add_header APPENDS (two CSP headers are enforced as
# their intersection and flagged by scanners). But responses nginx produces
# itself on these paths — 413 body too large, 502/504 while the app is
# down or slow — never reach the backend and would go out bare. These maps
# emit the API set ONLY when the upstream response did not carry the header
# (empty value = add_header emits nothing).
map $upstream_http_content_security_policy $api_csp_fallback {
    ""      "default-src 'none'; frame-ancestors 'none'";
    default "";
}
map $upstream_http_x_content_type_options $api_nosniff_fallback {
    ""      "nosniff";
    default "";
}
map $upstream_http_x_frame_options $api_xfo_fallback {
    ""      "DENY";
    default "";
}
map $upstream_http_referrer_policy $api_referrer_fallback {
    ""      "no-referrer";
    default "";
}

server {
    listen 8080;

    # Don't advertise the nginx version in the Server header or on error
    # pages (E1).
    server_tokens off;

    # Matches the backend's multipart max-request-size (bulk image uploads).
    client_max_body_size 200m;

    # v1.2.0: compress text responses (text/html is always included). The
    # JS/CSS bundles shrink ~70 %, the API's JSON lists likewise. Below 1 KiB
    # the gzip framing costs more than it saves. `Vary: Accept-Encoding`
    # keeps shared caches from serving gzip to a client that cannot read it.
    # `gzip_proxied any`: requests arriving through CloudFront carry a Via
    # header, which would otherwise switch compression off.
    # BREACH note: the access token appears only in /api/auth/* response
    # bodies, which reflect no caller-chosen text; the refresh token is an
    # httpOnly cookie (headers are never compressed).
    gzip on;
    # text/javascript: what newer nginx mime.types map .js to.
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    # Level 5: about 15 kB less per cold load than the default 1 (QA OBS-03),
    # at a CPU cost that is small next to the TLS work for the same bytes.
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # BREACH review: API JSON is compressed too. The only secrets in API
    # bodies are access tokens in /api/auth/* answers, freshly issued on
    # every response (never a stable secret to guess byte by byte), and the
    # refresh token travels in an httpOnly cookie, not the body - so the
    # compression side channel has nothing to recover.

    # Both API path families go to Spring Boot; the ingestion pipeline runs
    # synchronously, so allow long reads.
    # oauth2|login/oauth2: the OIDC handshake endpoints (ws07) — Spring
    # Security's authorization redirect + provider callback. /login itself
    # (without /oauth2) stays a SPA route.
    location ~ ^/(api|oauth2|login/oauth2|Templates|TemplateFields|TemplateDataTypes|ValidationRules|Validation|ImportHistory|ImportDetails|ProcessStep)(/|$) {
        # The API upstream: `app:8080` (compose service) unless the
        # container's MODOCUMENT_API_UPSTREAM says otherwise (ECS awsvpc
        # task: 127.0.0.1:<app port>). Rendered at start by envsubst.
        proxy_pass http://${MODOCUMENT_API_UPSTREAM};
        # Host and X-Forwarded-Host are the CONFIGURED public host[:port]
        # (MODOCUMENT_PUBLIC_HOST, validated at start by the entrypoint
        # script named above), never the client's Host header: the app builds
        # OIDC redirect URIs and other absolute URLs from X-Forwarded-Host.
        proxy_set_header Host ${MODOCUMENT_PUBLIC_HOST};
        # Trusted-proxy contract (pairs with server.forward-headers-strategy:
        # framework in application.yml): OVERWRITE the forwarding headers —
        # the app trusts exactly one hop, this nginx. Never use
        # $proxy_add_x_forwarded_for here — it APPENDS to whatever the client
        # sent, letting any caller plant the first hop the app trusts for
        # per-IP rate limiting and audit IPs. X-Forwarded-Proto: https makes
        # the app emit HSTS and build https OIDC redirect URIs.
        #   EDGE mode (default, docker-compose: MODOCUMENT_TRUSTED_PROXY_CIDRS
        #   unset) renders `$remote_addr` / `$scheme`: this proxy's own view
        #   of the connection, the client's headers discarded.
        #   TRUSTED-PROXY mode (ECS behind the ALB) renders the client
        #   address that realip resolved from the trusted ALB's
        #   X-Forwarded-For (or CloudFront-Viewer-Address in production) and
        #   the ALB's X-Forwarded-Proto — taken ONLY when the TCP peer is in
        #   MODOCUMENT_TRUSTED_PROXY_CIDRS, otherwise this hop's own values.
        #   Maps + set_real_ip_from: conf.d/modocument-trusted-proxy.conf,
        #   generated by the entrypoint script named above.
        proxy_set_header X-Forwarded-For ${MODOCUMENT_NGX_FORWARDED_FOR};
        proxy_set_header X-Forwarded-Proto ${MODOCUMENT_NGX_FORWARDED_PROTO};
        proxy_set_header X-Forwarded-Host ${MODOCUMENT_PUBLIC_HOST};
        # Clear every OTHER forwarding header a client may send. Spring's
        # ForwardedHeaderFilter prefers RFC 7239 `Forwarded` over the
        # X-Forwarded-For set above, so passing it through would let any
        # caller choose the IP the app uses for rate limits and audit rows.
        # An empty value removes the header from the proxied request.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        # ws26: client-certificate identity is accepted ONLY on the mTLS
        # server below; on this server a client could send these headers
        # through the browser listener itself, so they are always cleared.
        proxy_set_header X-Amzn-Mtls-Clientcert "";
        proxy_set_header X-Amzn-Mtls-Clientcert-Serial-Number "";
        proxy_set_header X-Amzn-Mtls-Clientcert-Issuer "";
        proxy_set_header X-Amzn-Mtls-Clientcert-Subject "";
        proxy_set_header X-Amzn-Mtls-Clientcert-Validity "";
        proxy_set_header X-Amzn-Mtls-Clientcert-Leaf "";
        proxy_read_timeout 900s;

        # API header set: the backend's own; the fallbacks (maps above) fill
        # in only for responses nginx generated itself. No SPA snippet here.
        add_header Content-Security-Policy $api_csp_fallback always;
        add_header X-Content-Type-Options $api_nosniff_fallback always;
        add_header X-Frame-Options $api_xfo_fallback always;
        add_header Referrer-Policy $api_referrer_fallback always;
    }

    # --- Static delivery (v1.2.0) -------------------------------------------
    # Every static location below repeats `include snippets/security-headers.conf`:
    # its own Cache-Control add_header would otherwise drop the inherited set
    # (scripts/check-nginx-headers.sh fails the build if one is missing).

    # Hashed Vite output (index-<hash>.js, vendor-<hash>.js, one chunk per
    # route page, the CSS): a file's content never changes under its name, so
    # browsers and CloudFront keep it for a year without revalidating. A
    # missing chunk (an old tab after a deploy) is a real 404, never
    # index.html served as JavaScript — the SPA's vite:preloadError handler
    # then reloads once onto the new build. Cache-Control is NOT `always`:
    # a 404 must not be cached as immutable.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/security-headers.conf;
    }

    # The SPA shell names the current hashed bundles, so it is revalidated
    # on every load (no-cache = use only after an ETag/Last-Modified check):
    # a deploy reaches open browsers on their next navigation. Every SPA
    # route ends here via the fallback below.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
    }

    # SPA fallback: every other route serves the React app (index.html via
    # the exact location above) — with the full SPA security header set.
    # Other files from public/ (favicon.svg, .well-known/security.txt) are
    # unhashed, so they are revalidated too.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
    }
}

# --- ws26 mTLS API server ---------------------------------------------------
# Target of the ALB's optional api.<domain> listener in mTLS VERIFY mode
# (infra/terraform/modules/ecs-app/mtls.tf; only that listener's target group
# points here). The ALB verified the client certificate against the banks'
# trust store and sends X-Amzn-Mtls-Clientcert-{Serial-Number, Issuer,
# Subject, Validity, Leaf}; the app maps the certificate to an ApiClient.
# Those headers are passed on ONLY when the TCP peer is a trusted proxy
# (MODOCUMENT_TRUSTED_PROXY_CIDRS — the same trusted-proxy model as
# X-Forwarded-For); from anyone else, and always in edge mode
# (docker-compose), they are cleared. Machine routes only.
server {
    listen 8443;
    server_tokens off;
    # Integration file uploads (POST /api/integration/v1/files).
    client_max_body_size 200m;
    # The URL-encoded leaf certificate makes for a long header.
    large_client_header_buffers 4 16k;

    # ALB target-group health check (no client certificate involved).
    location = /nginx-health {
        default_type text/plain;
        include snippets/security-headers.conf;
        return 200 "ok\n";
    }

    location ~ ^/api/(integration|agent)/ {
        proxy_pass http://${MODOCUMENT_API_UPSTREAM};
        # Same trusted-proxy contract as the 8080 server (see there).
        proxy_set_header Host ${MODOCUMENT_PUBLIC_HOST};
        proxy_set_header X-Forwarded-For ${MODOCUMENT_NGX_FORWARDED_FOR};
        proxy_set_header X-Forwarded-Proto ${MODOCUMENT_NGX_FORWARDED_PROTO};
        proxy_set_header X-Forwarded-Host ${MODOCUMENT_PUBLIC_HOST};
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        # Verify mode only: the passthrough header (whole chain) is never used.
        proxy_set_header X-Amzn-Mtls-Clientcert "";
        proxy_set_header X-Amzn-Mtls-Clientcert-Serial-Number ${MODOCUMENT_NGX_MTLS_SERIAL};
        proxy_set_header X-Amzn-Mtls-Clientcert-Issuer ${MODOCUMENT_NGX_MTLS_ISSUER};
        proxy_set_header X-Amzn-Mtls-Clientcert-Subject ${MODOCUMENT_NGX_MTLS_SUBJECT};
        proxy_set_header X-Amzn-Mtls-Clientcert-Validity ${MODOCUMENT_NGX_MTLS_VALIDITY};
        proxy_set_header X-Amzn-Mtls-Clientcert-Leaf ${MODOCUMENT_NGX_MTLS_LEAF};
        proxy_read_timeout 120s;

        add_header Content-Security-Policy $api_csp_fallback always;
        add_header X-Content-Type-Options $api_nosniff_fallback always;
        add_header X-Frame-Options $api_xfo_fallback always;
        add_header Referrer-Policy $api_referrer_fallback always;
    }

    # Nothing else is served on the machine listener.
    location / {
        include snippets/security-headers.conf;
        return 404;
    }
}
