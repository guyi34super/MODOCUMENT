# Runs in the unprivileged nginx image (frontend/Dockerfile): the worker
# listens on 8080 as a non-root user (SUP-S04); compose maps 3000:8080.
server {
    listen 8080;

    # Don't advertise the nginx version on error pages / Server header (E1).
    server_tokens off;

    # Matches the backend's 50MB multipart limit.
    # Matches the backend's multipart max-request-size (bulk image uploads).
    client_max_body_size 200m;

    # Both API path families go to Spring Boot; the ingestion pipeline runs
    # synchronously, so allow long reads.
    # oauth2|login/oauth2: the OIDC handshake endpoints (ws07) — Spring
    # Security's authorization redirect + provider callback. /login itself
    # (without /oauth2) stays a SPA route.
    #
    # NO add_header here (E1, deliberate): the backend sets its own security
    # headers on every API response (SecurityConfig — CSP default-src 'none',
    # nosniff, XFO, Referrer-Policy, HSTS behind X-Forwarded-Proto: https),
    # and nginx's add_header would APPEND, not replace — a second, different
    # CSP on API responses would be enforced as the intersection and read as
    # a misconfiguration in scans. Static responses get the full set below.
    location ~ ^/(api|oauth2|login/oauth2|Templates|TemplateFields|TemplateDataTypes|ValidationRules|Validation|ImportHistory|ImportDetails|ProcessStep)(/|$) {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # Trusted-proxy contract (pairs with server.forward-headers-strategy:
        # framework in application.yml): OVERWRITE the forwarding headers with
        # this proxy's own view of the connection. Never use
        # $proxy_add_x_forwarded_for here — it APPENDS to whatever the client
        # sent, letting any caller plant the first hop the app trusts for
        # per-IP rate limiting and audit IPs. X-Forwarded-Proto: https makes
        # the app emit HSTS; with the $scheme overwrite that happens when TLS
        # terminates AT this nginx. Terminating at an outer balancer instead?
        # Forward ITS X-Forwarded-* here verbatim (it then overwrites the
        # client's values) rather than this proxy's own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
    }

    # SPA fallback: every other route serves the React app.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # --- Security headers for the SPA and its static assets (E1) -------
        # "always" so 404s and other error responses carry them too. Full
        # inventory + rationale: docs/security/web-hardening.md.
        #
        # CSP tailored to the built app: Vite emits hashed /assets bundles and
        # an index.html with NO inline scripts, so script-src stays 'self'.
        # style-src needs 'unsafe-inline' only because React sets style=""
        # attributes at runtime (no external stylesheets, no style elements
        # beyond the hashed CSS bundle). img-src data: covers the TOTP QR code
        # (qrcode renders to a data: URL client-side — no remote origins).
        # The SPA only ever calls its own origin (nginx proxies /api), so
        # connect-src is 'self'.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # HSTS is only honored by browsers when received over HTTPS, so this
        # is inert on plain-HTTP local dev and takes effect exactly where it
        # matters: behind the production TLS terminator.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
