server {
    listen 80;

    # Matches the backend's 50MB multipart limit.
    client_max_body_size 50m;

    # Both API path families go to Spring Boot; the ingestion pipeline runs
    # synchronously, so allow long reads.
    location ~ ^/(api|Templates|TemplateFields|TemplateDataTypes|ValidationRules|Validation|ImportHistory|ImportDetails|ProcessStep)(/|$) {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
    }

    # SPA fallback: every other route serves the React app.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
