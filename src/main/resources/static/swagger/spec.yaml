openapi: 3.0.1
info:
  title: MoDocument Service
  version: "1.0"
servers:
- url: /
paths:
  /TemplateDataTypes/GetAll:
    get:
      description: Get a list of TemplateDataTypes
      operationId: getAllTemplateTypes
      responses:
        default:
          description: OK
      summary: Get a list of TemplateDataTypes
      tags:
      - TemplateDataTypes 
  /TemplateDataTypes/GetById/{id}:
    get:
      description: Get a TemplateType By Id
      operationId: getTemplateTypeById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the TemplateType record
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response
        '404':
          description: Not found
      summary: Get a TemplateType by Id
      tags:
      - TemplateDataTypes
  /TemplateDataTypes/Create:
    post:
      description: Create a new TemplateDataTypes
      operationId: postTemplateTypes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateTypesCreate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateTypesCreate'
          description: success
      summary: Create a new TemplateType
      tags:
      - TemplateDataTypes
  /TemplateDataTypes/Update:
    put:
      description: Update a TemplateType
      operationId: putTemplateTypes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateTypesUpdate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateTypesUpdate'
          description: success
      summary: Update a TemplateType
      tags:
      - TemplateDataTypes
  /TemplateDataTypes/{Id}:
    delete:
      description: Deletes the TemplateType
      operationId: deleteTemplateType
      parameters:
      - content:
          text/plain:
            schema:
              format: int32
              type: integer
        description: Id of the TemplateType to delete
        in: path
        name: Id
        required: true
      requestBody:
        content:
          text/plain:
            schema:
              format: int32
              type: integer
      responses:
        "200":
          content:
            text/plain:
              schema:
                format: int32
                type: integer
          description: success
      summary: Delete a TemplateType by Id
      tags:
      - TemplateDataTypes
  /Templates/GetAll:
    get:
      description: Get a list of Templates
      operationId: getAllTemplates
      responses:
        default:
          description: OK
      summary: Get a list of Templates
      tags:
      - Templates 
  /Templates/GetById/{id}:
    get:
      description: Get a Template By Id
      operationId: getTemplateById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the Template record
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response
        '404':
          description: Not found
      summary: Get a Template by Id
      tags:
      - Templates
  /Templates/Create:
    post:
      description: Create a new Template
      operationId: postTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCreate'
          description: success
      summary: Create a new Template
      tags:
      - Templates
  /Templates/Update:
    put:
      description: Update a Template. With maker/checker gating on templates
        (modocument.security.maker-checker.template-changes, the production
        default) this SUBMITS a pending change (202) that a different user
        must approve via /api/admin/changes/{id}/approve; with the gate off
        it applies directly.
      operationId: putTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUpdate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateUpdate'
          description: success
        "202":
          description: Submitted for approval (pending change)
      summary: Update a Template
      tags:
      - Templates
  /Templates/{Id}:
    delete:
      description: Deletes the Template
      operationId: deleteTemplate
      parameters:
      - content:
          text/plain:
            schema:
              format: int32
              type: integer
        description: Id of the Template to delete
        in: path
        name: Id
        required: true
      requestBody:
        content:
          text/plain:
            schema:
              format: int32
              type: integer
      responses:
        "200":
          content:
            text/plain:
              schema:
                format: int32
                type: integer
          description: success
        "202":
          description: Submitted for approval (maker/checker gate on, the
            production default)
      summary: Delete a Template by Id
      tags:
      - Templates
  /ProcessStep/GetAll:
    get:
      description: Get a list of ProcessSteps
      operationId: getAllProcessSteps
      responses:
        default:
          description: OK
      summary: Get a list of ProcessSteps
      tags:
      - ProcessStep 
  /ProcessStep/GetById/{id}:
    get:
      description: Get a ProcessStep By Id
      operationId: getProcessStepById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the ProcessStep record
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response
        '404':
          description: Not found
      summary: Get a ProcessStep by Id
      tags:
      - ProcessStep
  /ProcessStep/Create:
    post:
      description: Create a new ProcessStep
      operationId: postProcessStep
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessStepCreate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStepCreate'
          description: success
      summary: Create a new ProcessStep
      tags:
      - ProcessStep
  /ProcessStep/Update:
    put:
      description: Update a ProcessStep
      operationId: putProcessStep
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessStepUpdate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStepUpdate'
          description: success
      summary: Update a TemplateType
      tags:
      - ProcessStep
  /ProcessStep/{Id}:
    delete:
      description: Deletes the ProcessStep
      operationId: deleteProcessStep
      parameters:
      - content:
          text/plain:
            schema:
              format: int32
              type: integer
        description: Id of the ProcessStep to delete
        in: path
        name: Id
        required: true
      requestBody:
        content:
          text/plain:
            schema:
              format: int32
              type: integer
      responses:
        "200":
          content:
            text/plain:
              schema:
                format: int32
                type: integer
          description: success
      summary: Delete a ProcessStep by Id
      tags:
      - ProcessStep
  /TemplateFields/GetAll:
    get:
      parameters:
        - name: templateId
          in: query
          required: false
          description: Scope the answer to one template's fields.
          schema:
            format: int32
            type: integer
      description: Get a list of TemplateFields
      operationId: getAllTemplateFields
      responses:
        default:
          description: OK
      summary: Get a list of TemplateFields
      tags:
      - TemplateFields 
  /TemplateFields/GetById/{id}:
    get:
      description: Get a TemplateField By Id
      operationId: getTemplateFieldById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the TemplateField record
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response
        '404':
          description: Not found
      summary: Get a TemplateField by Id
      tags:
      - TemplateFields
  /TemplateFields/Create:
    post:
      description: Create a new TemplateField
      operationId: postTemplateField
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateFieldCreate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateFieldCreate'
          description: success
      summary: Create a new TemplateField
      tags:
      - TemplateFields
  /TemplateFields/Update/{id}:
    put:
      description: Update a TemplateField
      operationId: putTemplateField
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateFieldUpdate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateFieldUpdate'
          description: success
      summary: Update a TemplateField
      tags:
      - TemplateFields
  /TemplateFields/{Id}:
    delete:
      description: Deletes the TemplateField
      operationId: deleteTemplateField
      parameters:
      - content:
          text/plain:
            schema:
              format: int32
              type: integer
        description: Id of the TemplateField to delete
        in: path
        name: Id
        required: true
      requestBody:
        content:
          text/plain:
            schema:
              format: int32
              type: integer
      responses:
        "200":
          content:
            text/plain:
              schema:
                format: int32
                type: integer
          description: success
      summary: Delete a TemplateField by Id
      tags:
      - TemplateFields
  /ImportHistory/GetAll:
    get:
      description: Get a list of ImportHistory
      operationId: getAllImportHistory
      responses:
        default:
          description: OK
      summary: Get a list of ImportHistory
      tags:
      - ImportHistory 
  /ImportHistory/GetById/{id}:
    get:
      description: Get a ImportHistory By Id
      operationId: getImportHistoryById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the ImportHistory record
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response
        '404':
          description: Not found
      summary: Get a ImportHistory by Id
      tags:
      - ImportHistory
  /ImportHistory/Create:
    post:
      description: Create a new ImportHistory
      operationId: postImportHistory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportHistoryCreate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportHistoryCreate'
          description: success
      summary: Create a new ImportHistory
      tags:
      - ImportHistory
  /ImportHistory/Update/{id}:
    put:
      description: Update an ImportHistory
      operationId: putImportHistory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportHistoryUpdate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportHistoryUpdate'
          description: success
      summary: Update an ImportHistory
      tags:
      - ImportHistory
  /ImportHistory/{Id}:
    delete:
      description: Deletes the ImportHistory by Id
      operationId: deleteImportHistory
      parameters:
      - content:
          text/plain:
            schema:
              format: int32
              type: integer
        description: Id of the ImportHistory to delete
        in: path
        name: Id
        required: true
      requestBody:
        content:
          text/plain:
            schema:
              format: int32
              type: integer
      responses:
        "200":
          content:
            text/plain:
              schema:
                format: int32
                type: integer
          description: success
      summary: Delete a ImportHistory by Id
      tags:
      - ImportHistory
  /ImportDetails/GetAll:
    get:
      description: Get a list of ImportDetails
      operationId: getAllImportDetails
      responses:
        default:
          description: OK
      summary: Get a list of ImportDetails
      tags:
      - ImportDetails 
  /ImportDetails/GetById/{id}:
    get:
      description: Get a ImportDetails By Id
      operationId: getImportDetailsById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the ImportDetails record
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful response
        '404':
          description: Not found
      summary: Get a ImportDetails by Id
      tags:
      - ImportDetails
  /ImportDetails/Create:
    post:
      description: Create a new ImportDetails
      operationId: postImportDetails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDetailsCreate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDetailsCreate'
          description: success
      summary: Create a new ImportDetails
      tags:
      - ImportDetails
  /ImportDetails/Update/{id}:
    put:
      description: Update an ImportDetails
      operationId: putImportDetails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDetailsUpdate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDetailsUpdate'
          description: success
      summary: Update an ImportDetails
      tags:
      - ImportDetails
  /ImportDetails/{Id}:
    delete:
      description: Deletes the ImportDetails by Id
      operationId: deleteImportDetails
      parameters:
      - content:
          text/plain:
            schema:
              format: int32
              type: integer
        description: Id of the ImportDetails to delete
        in: path
        name: Id
        required: true
      requestBody:
        content:
          text/plain:
            schema:
              format: int32
              type: integer
      responses:
        "200":
          content:
            text/plain:
              schema:
                format: int32
                type: integer
          description: success
      summary: Delete a ImportDetails by Id
      tags:
      - ImportDetails
  /Templates/CreateWithFields:
    post:
      description: Create a custom template with its fields and validation rules
        (regex patterns are compiled and rejected with details when invalid)
      operationId: createTemplateWithFields
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                fields:
                  type: array
                  items:
                    type: object
                    properties:
                      fieldName:
                        type: string
                      dataType:
                        type: string
                        description: TemplateDataType name (Text/Number/Date) or id
                      rules:
                        type: array
                        items:
                          type: object
                          properties:
                            ruleType:
                              type: string
                              description: RuleType enum name, e.g. REGEX, REQUIRED
                            config:
                              type: object
      responses:
        "201":
          description: Created
        "400":
          description: Invalid template definition (details in errors array)
      summary: Create a template with fields and validation rules
      tags:
      - Templates
  /ValidationRules/GetByTemplate/{templateId}:
    get:
      description: List the validation rules configured for a template
      operationId: getValidationRulesByTemplate
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            format: int32
            type: integer
      responses:
        default:
          description: OK
      summary: List validation rules for a template
      tags:
      - ValidationRules
  /ValidationRules/Upsert:
    put:
      description: Insert or update a validation rule (regex patterns are verified)
      operationId: upsertValidationRule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  format: int32
                  type: integer
                fieldName:
                  type: string
                ruleType:
                  type: string
                config:
                  type: object
      responses:
        default:
          description: OK
      summary: Upsert a validation rule
      tags:
      - ValidationRules
  /ValidationRules:
    delete:
      description: Delete a rule. Field name travels as a query parameter so names
        containing a slash (e.g. "Province/State") can be addressed at all.
      operationId: deleteValidationRule
      parameters:
      - name: templateId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: fieldName
        in: query
        required: true
        schema:
          type: string
      - name: ruleType
        in: query
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: No such rule
      summary: Delete a validation rule
      tags:
      - ValidationRules
  /ValidationRules/{templateId}/{fieldName}/{ruleType}:
    delete:
      description: Delete a validation rule by its composite key
      operationId: deleteValidationRule
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            format: int32
            type: integer
        - name: fieldName
          in: path
          required: true
          schema:
            type: string
        - name: ruleType
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
      summary: Delete a validation rule
      tags:
      - ValidationRules
  /api/ingestion/jobs:
    get:
      description: List all ingestion jobs with their checkpoints
      operationId: listIngestionJobs
      responses:
        default:
          description: OK
      summary: List ingestion jobs
      tags:
      - IngestionJobs
    post:
      description: Create a resumable ingestion job. Accepts multipart/form-data
        (file + templateId + optional autoRun) or application/json (fileName of a
        previously uploaded file + templateId + optional autoRun). With autoRun
        (default true) the job runs parse -> map -> validate immediately.
      operationId: createIngestionJob
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                templateId:
                  format: int32
                  type: integer
                autoRun:
                  type: boolean
                runUntil:
                  description: Stage to stop at, inclusive. Defaults to MAPPED so the
                    user reviews the column mapping before validation.
                  type: string
                  enum: [UPLOADED, PARSED, MAPPED, VALIDATED, EXPORTED]
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                templateId:
                  format: int32
                  type: integer
                autoRun:
                  type: boolean
                runUntil:
                  description: Stage to stop at, inclusive. Defaults to MAPPED.
                  type: string
                  enum: [UPLOADED, PARSED, MAPPED, VALIDATED, EXPORTED]
      responses:
        "201":
          description: Created
      summary: Create an ingestion job
      tags:
      - IngestionJobs
  /api/ingestion/jobs/{id}:
    get:
      description: Get an ingestion job with parsed table, mapping, validation
        results, and export info
      operationId: getIngestionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int32
            type: integer
      responses:
        default:
          description: OK
      summary: Get an ingestion job
      tags:
      - IngestionJobs
  /api/ingestion/jobs/{id}/resume:
    post:
      description: Continue the pipeline from the last completed step (also after
        a failure)
      operationId: resumeIngestionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int32
            type: integer
        - name: until
          in: query
          required: false
          description: Stage to stop at, inclusive. Defaults to VALIDATED.
          schema:
            type: string
            enum: [UPLOADED, PARSED, MAPPED, VALIDATED, EXPORTED]
      responses:
        default:
          description: OK
      summary: Resume an ingestion job
      tags:
      - IngestionJobs
  /api/ingestion/jobs/{id}/remap:
    post:
      description: Re-run the auto-mapping stage on the parsed table
      operationId: remapIngestionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int32
            type: integer
      responses:
        default:
          description: OK
      summary: Re-run mapping
      tags:
      - IngestionJobs
  /api/ingestion/jobs/{id}/revalidate:
    post:
      description: Re-run validation on the mapped rows
      operationId: revalidateIngestionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int32
            type: integer
      responses:
        default:
          description: OK
      summary: Re-run validation
      tags:
      - IngestionJobs
  /api/ingestion/jobs/{id}/cancel:
    post:
      description: Cancel the job (terminal; it can no longer be resumed)
      operationId: cancelIngestionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int32
            type: integer
      responses:
        default:
          description: OK
      summary: Cancel an ingestion job
      tags:
      - IngestionJobs
  /api/ingestion/jobs/{id}/mapping:
    put:
      description: Apply a user-reviewed mapping override (source column ->
        template field or null); rebuilds the mapped rows and clears validation
      operationId: updateIngestionJobMapping
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int32
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mapping:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        default:
          description: OK
      summary: Override the column mapping
      tags:
      - IngestionJobs
  /api/ingestion/jobs/{id}/chat-edit:
    post:
      description: Modify the job's current table with a natural-language
        instruction executed by the LLM; clears stale validation results
      operationId: chatEditIngestionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int32
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instruction:
                  type: string
      responses:
        default:
          description: OK
      summary: Edit the table via chat instruction
      tags:
      - IngestionJobs
  /api/ingestion/jobs/{id}/export/file:
    get:
      description: Download the validated (mapped) rows as csv, json, xlsx, tsv, or xml;
        a copy is archived under wwwroot/exports
      operationId: exportIngestionJobFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int32
            type: integer
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json, xlsx, tsv, xml]
      responses:
        "200":
          description: File download
        "409":
          description: Job is not finished — cancelled, a template field still
            unmapped, or rows still failing validation (the body says which)
      summary: Export to a file
      tags:
      - IngestionJobs
  /api/ingestion/jobs/{id}/export/database:
    post:
      description: Insert the validated (mapped) rows into a user-supplied
        database over JDBC (postgresql/h2 URL prefixes); identifiers are strictly
        validated, values are bound parameters, credentials are never stored
      operationId: exportIngestionJobDatabase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int32
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jdbcUrl:
                  type: string
                username:
                  type: string
                password:
                  type: string
                tableName:
                  type: string
                createTableIfMissing:
                  type: boolean
      responses:
        "200":
          description: Updated job
        "400":
          description: Rejected jdbcUrl, identifier, or target-database error
        "409":
          description: Job is not finished — cancelled, a template field still
            unmapped, or rows still failing validation (the body says which)
        "502":
          description: Target database unreachable
      summary: Export to a custom database
      tags:
      - IngestionJobs
  /api/auth/login:
    post:
      description: Exchange credentials for a short-lived bearer token; also
        sets the httpOnly rotating refresh cookie (modoc_refresh, path
        /api/auth/refresh). Accounts are admin-created — there is no public
        registration endpoint.
      operationId: login
      security: []
      responses:
        "200":
          description: Token and user profile (incl. role and bankId)
        "401":
          description: Invalid credentials
      summary: Log in
      tags:
      - Auth
  /api/auth/refresh:
    post:
      description: Rotate the refresh cookie and return a fresh access token.
        Presenting an already-rotated or revoked cookie revokes the whole
        token family.
      operationId: refresh
      security: []
      responses:
        "200":
          description: New token and user profile; new refresh cookie
        "401":
          description: Missing, expired, revoked, or reused refresh token
      summary: Refresh tokens
      tags:
      - Auth
  /api/auth/providers:
    get:
      description: Configured OIDC single sign-on providers for the login
        page's buttons — registration ids plus display names, nothing secret.
        Empty list when no provider is configured. The browser starts an SSO
        login by navigating to /oauth2/authorization/{id}; after the external
        IdP authenticates, the app issues its OWN tokens (refresh cookie +
        /api/auth/refresh) — no external token is ever an API credential.
      operationId: authProviders
      security: []
      responses:
        "200":
          description: 'Array of { id, name }; empty when OIDC is not configured'
      summary: OIDC providers
      tags:
      - Auth
  /api/auth/logout:
    post:
      description: Revoke the current access token (jti denylist) and every
        refresh token of the user; clears the refresh cookie
      operationId: logout
      responses:
        "204":
          description: Session revoked
      summary: Log out
      tags:
      - Auth
  /api/auth/me:
    get:
      description: The signed-in user's profile
      operationId: currentUser
      responses:
        "200":
          description: User profile
      summary: Current user
      tags:
      - Auth
  /api/auth/profile:
    put:
      description: Update the signed-in user's display name
      operationId: updateProfile
      responses:
        "200":
          description: Updated profile
      summary: Update profile
      tags:
      - Auth
  /api/auth/password:
    put:
      description: Change the signed-in user's password
      operationId: changePassword
      responses:
        "204":
          description: Changed
        "400":
          description: Current password wrong or new password too weak
      summary: Change password
      tags:
      - Auth
  /api/admin/users:
    get:
      description: Users of the calling admin's own bank (ADMIN only)
      operationId: listBankUsers
      responses:
        "200":
          description: Users with role, state, last login and MFA state
      summary: List users
      tags:
      - UserAdmin
    post:
      description: Request creating a user in the calling admin's bank with a
        temporary password that must be changed on first login. Maker/checker
        (ws10) — a DIFFERENT admin must approve the pending change before the
        account exists; the payload stores only the password's hash.
      operationId: createBankUser
      responses:
        "202":
          description: Pending change submitted for approval
        "400":
          description: Invalid role, or temporary password rejected by the policy
        "409":
          description: Email already in use
      summary: Request user creation
      tags:
      - UserAdmin
  /api/admin/users/{id}/role:
    put:
      description: Request changing a user's role (maker/checker, ws10). On a
        different admin's approval the change applies and every outstanding
        session of the user ends immediately.
      operationId: changeUserRole
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "202":
          description: Pending change submitted for approval
        "404":
          description: Unknown id, or a user of another bank
        "409":
          description: Own role (self-targeting refused at submit)
      summary: Request role change
      tags:
      - UserAdmin
  /api/admin/users/{id}/disabled:
    put:
      description: Enable or disable a user (the leaver switch). Disabling is
        maker/checker-gated (202) and makes the account inert the moment a
        DIFFERENT admin approves; re-enabling applies directly (200) — the
        lower-risk direction.
      operationId: setUserDisabled
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Updated user (enable only)
        "202":
          description: Pending disable submitted for approval
        "404":
          description: Unknown id, or a user of another bank
        "409":
          description: Own account (self-targeting refused at submit)
      summary: Enable user, or request disable
      tags:
      - UserAdmin
  /api/admin/users/export:
    get:
      description: CSV of the bank's users with last-login dates
        (users-{bankCode}-{date}.csv)
      operationId: exportBankUsers
      responses:
        "200":
          description: text/csv download
      summary: Export user list
      tags:
      - UserAdmin
  /api/admin/users/access-review:
    get:
      description: Quarterly recertification worksheet (role, last login,
        90-day inactivity flags)
      operationId: accessReviewWorksheet
      responses:
        "200":
          description: Per-user review rows
      summary: Access review
      tags:
      - UserAdmin
  /api/admin/changes:
    get:
      description: The caller's bank's maker/checker queue (ws10). Holders of
        change:approve (ADMIN, APPROVER) see everything; a maker without it
        sees only their own submissions. Payloads are sanitized — credential
        material never leaves the backend.
      operationId: listPendingChanges
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [REQUESTED, APPROVED, REJECTED, CANCELLED, APPLIED, FAILED]
      responses:
        "200":
          description: Pending changes, newest first
      summary: List pending changes
      tags:
      - Changes
    post:
      description: Submit a change for approval ({changeType, payload,
        comment}). The maker needs the SAME permission the direct operation
        required (user ops user:admin, template ops template:write).
      operationId: submitPendingChange
      responses:
        "202":
          description: Pending change submitted
        "400":
          description: Unknown change type or invalid payload
        "403":
          description: Missing the change type's maker permission
      summary: Submit change
      tags:
      - Changes
  /api/admin/changes/{id}/approve:
    post:
      description: Approve AND apply a pending change (gate B7). The maker
        approving their own change is a hard 409, audited
        SELF_APPROVAL_BLOCKED; the appliers re-run every invariant at apply
        time.
      operationId: approvePendingChange
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Applied change
        "404":
          description: Unknown id, or a change of another bank
        "409":
          description: Self-approval, already decided, or an apply-time
            invariant refused (the change is then FAILED)
      summary: Approve change
      tags:
      - Changes
  /api/admin/changes/{id}/reject:
    post:
      description: Refuse a pending change; nothing is applied
      operationId: rejectPendingChange
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Rejected change
        "404":
          description: Unknown id, or a change of another bank
        "409":
          description: Already decided
      summary: Reject change
      tags:
      - Changes
  /api/admin/changes/{id}/cancel:
    post:
      description: Withdraw an undecided request — only its maker can
      operationId: cancelPendingChange
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Cancelled change
        "404":
          description: Unknown id, or a change of another bank
        "409":
          description: Not the maker, or already decided
      summary: Cancel change
      tags:
      - Changes
  /api/ingestion/supported-types:
    get:
      description: Extensions this build can parse, plus a ready-made accept list
      operationId: supportedDocumentTypes
      responses:
        "200":
          description: '{ extensions, accept, description }'
      summary: Supported document types
      tags:
      - Ingestion
  /api/ingestion/jobs/{id}/rows:
    put:
      description: Persist directly-edited cell values; clears validation and export
      operationId: updateIngestionRows
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Updated job
        "400":
          description: Row count changed or unknown column
        "409":
          description: Job is cancelled, has no mapped rows, or was changed concurrently
      summary: Update mapped rows
      tags:
      - Ingestion
  /api/ingestion/jobs/{id}/wizard-step:
    put:
      description: Checkpoint the wizard pane the user is on, so reopening resumes
        there. Only a step the job has earned is accepted; every job payload carries
        a reachableSteps list plus unmappedFields and validationErrorCount so a
        client never has to guess. Mapping is finished when every template field has
        a source column, validation when it has run with no failing rows.
      operationId: updateWizardStep
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Updated job
        "400":
          description: Step not reachable yet — the body names what is unfinished
        "409":
          description: Job is cancelled
      summary: Set wizard step
      tags:
      - Ingestion
  /Validation/validate:
    post:
      description: Run a template's rules over supplied rows; answers with the failures
      operationId: validateRows
      responses:
        "200":
          description: Validation results
      summary: Validate rows
      tags:
      - Validation
  /api/fileupload/upload:
    post:
      description: Store a document without creating an ingestion job
      operationId: uploadFile
      responses:
        "200":
          description: Stored file name and size
        "400":
          description: No file, or an unsupported type
        "413":
          description: File larger than the upload limit
      summary: Upload a file
      tags:
      - Files
  /api/aifiles/send:
    post:
      description: Diagnostic prompt passthrough to the configured provider
      operationId: sendPrompt
      responses:
        "200":
          description: Model response
        "400":
          description: Prompt missing or too long
        "502":
          description: Provider unreachable or rejected the request
        "503":
          description: No provider API key configured
      summary: Send a prompt
      tags:
      - AI
  /api/automapper/generate:
    post:
      description: Suggest a column mapping for an already-imported file
      operationId: generateAutoMapping
      responses:
        "200":
          description: Model response
        "400":
          description: Missing or oversized parameters
        "404":
          description: No import history for that file
      summary: Suggest a mapping
      tags:
      - AI
  /api/transform/transform:
    post:
      description: Apply the configured transformation to supplied rows
      operationId: transform
      responses:
        "200":
          description: Transformed rows
      summary: Transform rows
      tags:
      - Transform
  /api/extraction/sources:
    post:
      description: Create an extraction source (website / REST API / external database).
        Requires termsAcknowledged=true; website sources must allow-list their domains;
        configurations never store secrets.
      operationId: createExtractionSource
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [WEBSITE, REST_API, DATABASE]
                termsAcknowledged:
                  type: boolean
                dataSpec:
                  type: string
                templateId:
                  type: integer
                  description: Optional template whose fields define the data spec when dataSpec is blank; jobs inherit it.
                web:
                  type: object
                api:
                  type: object
                db:
                  type: object
      responses:
        '201':
          description: Created
        '400':
          description: Invalid configuration (e.g. terms not acknowledged)
      summary: Create an extraction source
      tags:
      - Extraction
    get:
      description: List extraction sources
      operationId: listExtractionSources
      responses:
        default:
          description: OK
      summary: List extraction sources
      tags:
      - Extraction
  /api/extraction/sources/{id}:
    get:
      description: Get an extraction source by id
      operationId: getExtractionSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: Not found
      summary: Get an extraction source
      tags:
      - Extraction
    put:
      description: Update an extraction source
      operationId: updateExtractionSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
      summary: Update an extraction source
      tags:
      - Extraction
    delete:
      description: Delete an extraction source
      operationId: deleteExtractionSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
      summary: Delete an extraction source
      tags:
      - Extraction
  /api/extraction/jobs:
    post:
      description: Create a distributed extraction job for a source and (by default)
        start it. Optional per-run credentials (dbUsername/dbPassword/apiToken) are
        held in memory only and never persisted.
      operationId: createExtractionJob
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceId:
                  type: string
                templateId:
                  type: integer
                dataSpec:
                  type: string
                incremental:
                  type: boolean
                autoStart:
                  type: boolean
                credentials:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '201':
          description: Created
      summary: Create (and start) an extraction job
      tags:
      - Extraction
    get:
      description: List extraction jobs
      operationId: listExtractionJobs
      responses:
        default:
          description: OK
      summary: List extraction jobs
      tags:
      - Extraction
  /api/extraction/jobs/{id}:
    get:
      description: Get an extraction job with live task counts
      operationId: getExtractionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: Not found
      summary: Get an extraction job
      tags:
      - Extraction
  /api/extraction/jobs/{id}/start:
    post:
      description: Plan seed tasks and start the workers
      operationId: startExtractionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Started
        '409':
          description: Already started
      summary: Start an extraction job
      tags:
      - Extraction
  /api/extraction/jobs/{id}/pause:
    post:
      description: Pause a running job (queued tasks stay queued)
      operationId: pauseExtractionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paused
      summary: Pause an extraction job
      tags:
      - Extraction
  /api/extraction/jobs/{id}/resume:
    post:
      description: Resume a paused or failed job; unfinished tasks are re-announced
      operationId: resumeExtractionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resumed
      summary: Resume an extraction job
      tags:
      - Extraction
  /api/extraction/jobs/{id}/cancel:
    post:
      description: Cancel a job; remaining tasks are skipped as workers reach them
      operationId: cancelExtractionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
      summary: Cancel an extraction job
      tags:
      - Extraction
  /api/extraction/jobs/{id}/records:
    get:
      description: Cursor-paged peek at the job's raw or processed records
      operationId: getExtractionRecords
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: raw or processed (default processed)
          schema:
            type: string
        - name: afterId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
      summary: Page through extracted records
      tags:
      - Extraction
  /api/extraction/jobs/{id}/audit:
    get:
      description: Cursor-paged audit trail (every fetch, robots/domain block, retry,
        dedup, LLM call, bridge)
      operationId: getExtractionAudit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: afterId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
      summary: Page through the extraction audit trail
      tags:
      - Extraction
  /api/extraction/jobs/{id}/bridge:
    post:
      description: Bridge extracted records into the document pipeline - auto-map onto
        the template, validate with the rule engine, and create a standard ingestion
        job (chat editing and file/database export then work unchanged).
      operationId: bridgeExtractionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: integer
                maxRows:
                  type: integer
                llmClean:
                  type: boolean
      responses:
        '200':
          description: Bridged; response includes the new ingestionJobId
        '409':
          description: Extraction job not completed yet
      summary: Bridge extracted records to a template
      tags:
      - Extraction
  /api/extraction/jobs/{id}/infer-schema:
    post:
      description: 'LLM agent: suggest a template schema (field names, types, examples)
        from sample extracted records'
      operationId: inferExtractionSchema
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '409':
          description: LLM key not configured or no records yet
      summary: Infer a schema from extracted records
      tags:
      - Extraction
  /api/extraction/jobs/{id}/summary:
    get:
      description: 'LLM agent: short human summary of the extraction run'
      operationId: summarizeExtractionJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
        '409':
          description: LLM key not configured
      summary: Summarize an extraction run
      tags:
      - Extraction
  /api/extraction/metrics:
    get:
      description: Queue depth, fetch/compliance counters, and worker pool state
      operationId: getExtractionMetrics
      responses:
        '200':
          description: Successful response
      summary: Extraction metrics
      tags:
      - Extraction
  /api/doccreation/blueprints:
    get:
      description: List the caller's document-creation blueprints with section and document counts
      operationId: listDocBlueprints
      responses:
        default:
          description: OK
      summary: List blueprints
      tags:
      - DocumentCreation
    post:
      description: Upload a .docx blueprint. An AI breakdown identifies the
        document's logical sections first (anchors validated against the real
        document); a heading-heuristic parser takes over when AI is disabled,
        unconfigured or its reply doesn't validate. Each section gets
        auto-assignment keywords. companyId (optional) selects a
        company-specific flow. The response's sectionSource says which engine
        produced the sections (AI or HEURISTIC).
      operationId: createDocBlueprint
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                companyId:
                  type: string
              required:
              - file
      responses:
        '201':
          description: Blueprint created with its parsed sections
        '400':
          description: Not a .docx or not readable
      summary: Upload a blueprint
      tags:
      - DocumentCreation
  /api/doccreation/blueprints/{id}:
    get:
      description: A blueprint with its ordered sections and keywords
      operationId: getDocBlueprint
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        default:
          description: OK
      summary: Get a blueprint
      tags:
      - DocumentCreation
    delete:
      description: Delete a blueprint. Refused (409) while documents are built on it.
      operationId: deleteDocBlueprint
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204':
          description: Deleted
        '409':
          description: Documents still reference this blueprint
      summary: Delete a blueprint
      tags:
      - DocumentCreation
  /api/doccreation/blueprints/{id}/file:
    get:
      description: Download the original uploaded .docx
      operationId: downloadDocBlueprintFile
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The stored blueprint file
      summary: Download the blueprint file
      tags:
      - DocumentCreation
  /api/doccreation/blueprints/{id}/sections/{sectionId}/keywords:
    put:
      description: Replace a section's image auto-assignment keywords
      operationId: updateDocSectionKeywords
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: sectionId, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords:
                  type: array
                  items: {type: string}
      responses:
        default:
          description: OK
      summary: Update section keywords
      tags:
      - DocumentCreation
  /api/doccreation/instances:
    get:
      description: List the caller's documents, optionally filtered by blueprintId
      operationId: listDocInstances
      parameters:
      - {name: blueprintId, in: query, required: false, schema: {type: integer}}
      responses:
        default:
          description: OK
      summary: List documents
      tags:
      - DocumentCreation
    post:
      description: Start a document from a blueprint
      operationId: createDocInstance
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blueprintId: {type: integer}
                title: {type: string}
              required: [blueprintId, title]
      responses:
        '201':
          description: Document created
      summary: Create a document
      tags:
      - DocumentCreation
  /api/doccreation/instances/{id}:
    get:
      description: The builder view - sections in document order with their content
        blocks, the Unsorted image tray, and whether PDF conversion is available
      operationId: getDocInstance
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        default:
          description: OK
      summary: Get a document (builder view)
      tags:
      - DocumentCreation
    put:
      description: Rename a document
      operationId: renameDocInstance
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
      responses:
        default:
          description: OK
      summary: Rename a document
      tags:
      - DocumentCreation
    delete:
      description: Delete a document with its blocks, images and generated files
      operationId: deleteDocInstance
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204':
          description: Deleted
      summary: Delete a document
      tags:
      - DocumentCreation
  /api/doccreation/instances/{id}/sections/{sectionId}/blocks:
    post:
      description: Append a content block to a section. PARAGRAPH takes text; IMAGE
        takes the assetId of an Unsorted image plus an optional caption.
      operationId: addDocBlock
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: sectionId, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blockType: {type: string, enum: [PARAGRAPH, IMAGE]}
                text: {type: string}
                assetId: {type: integer}
                caption: {type: string}
              required: [blockType]
      responses:
        '201':
          description: Block created
      summary: Add a block
      tags:
      - DocumentCreation
  /api/doccreation/instances/{id}/sections/{sectionId}/blocks/order:
    put:
      description: Reorder a section's blocks. blockIds must be a permutation of them.
      operationId: reorderDocBlocks
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: sectionId, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blockIds:
                  type: array
                  items: {type: integer}
      responses:
        default:
          description: OK
      summary: Reorder blocks
      tags:
      - DocumentCreation
  /api/doccreation/blocks/{blockId}:
    put:
      description: Edit a block - text for PARAGRAPH, caption for IMAGE
      operationId: updateDocBlock
      parameters:
      - {name: blockId, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: {type: string}
                caption: {type: string}
      responses:
        default:
          description: OK
      summary: Update a block
      tags:
      - DocumentCreation
    delete:
      description: Delete a block. An IMAGE block's asset returns to the Unsorted tray.
      operationId: deleteDocBlock
      parameters:
      - {name: blockId, in: path, required: true, schema: {type: integer}}
      responses:
        '204':
          description: Deleted
      summary: Delete a block
      tags:
      - DocumentCreation
  /api/doccreation/instances/{id}/assets:
    post:
      description: Bulk-upload images (png, jpg, jpeg, gif, bmp). With autoAssign
        (default true) each file name is matched against the sections' keywords and
        placed automatically; unmatched images land in the Unsorted tray. The reply
        splits assigned / unsorted / rejected per file.
      operationId: uploadDocAssets
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                autoAssign:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Upload outcome per file
      summary: Bulk-upload images
      tags:
      - DocumentCreation
  /api/doccreation/assets/{assetId}/content:
    get:
      description: The stored image bytes (for authenticated previews)
      operationId: getDocAssetContent
      parameters:
      - {name: assetId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Image bytes with the stored content type
      summary: Get an image
      tags:
      - DocumentCreation
  /api/doccreation/assets/{assetId}/assignment:
    put:
      description: Move an image into a section (creating or moving its IMAGE block)
        or back to Unsorted with sectionId null
      operationId: assignDocAsset
      parameters:
      - {name: assetId, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sectionId:
                  type: integer
                  nullable: true
      responses:
        default:
          description: OK
      summary: Assign an image
      tags:
      - DocumentCreation
  /api/doccreation/assets/{assetId}:
    delete:
      description: Delete an uploaded image (and its block, if placed)
      operationId: deleteDocAsset
      parameters:
      - {name: assetId, in: path, required: true, schema: {type: integer}}
      responses:
        '204':
          description: Deleted
      summary: Delete an image
      tags:
      - DocumentCreation
  /api/doccreation/instances/{id}/generate:
    post:
      description: Generate the final document. The AI composes it first - it is
        given the full template and everything the user added and returns the
        complete document as an assembly plan, validated to reproduce the
        template exactly (every original element kept once, in order; every user
        block placed exactly once; no invented content) - with the deterministic
        engine taking over whenever AI is disabled, unconfigured, over quota, or
        the plan fails validation (composedBy AI/ENGINE in the response). Always
        writes the .docx; also converts to PDF when LibreOffice is available
        (pdfReady false with pdfError otherwise - never a failure).
      operationId: generateDocInstance
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Generation outcome (docx name, pdf name/readiness)
      summary: Generate the document
      tags:
      - DocumentCreation
  /api/doccreation/instances/{id}/download:
    get:
      description: Download the generated file, regenerating first when the content
        changed since the last generation. format=pdf answers 409 when no converter
        is available.
      operationId: downloadDocInstance
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: format, in: query, required: false, schema: {type: string, enum: [docx, pdf], default: docx}}
      responses:
        '200':
          description: The generated file
        '409':
          description: PDF requested but no converter is available
      summary: Download the generated document
      tags:
      - DocumentCreation
