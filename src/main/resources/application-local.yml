# Local development: same PostgreSQL + Flyway setup as production (inherited
# from application.yml — jdbc:postgresql://localhost:5432/modocument by
# default, override via MODOCUMENT_DB_*), with dev conveniences layered on:
# dev JWT secret, Swagger, SQL-backed extraction in the same database, no
# Mongo/Kafka.
# Start a database first (docker compose up -d postgres), then run:
#   SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
spring:
  config:
    import: optional:file:./application-local-secrets.yml
  autoconfigure:
    # No Mongo/Kafka needed locally: extraction persists to the primary database.
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

modocument:
  security:
    jwt:
      # No signing key is committed. Provide one via the MODOCUMENT_JWT_SECRET
      # environment variable, or drop it into the gitignored
      # application-local-secrets.yml (imported above). Generate one with:
      #   openssl rand -base64 48
      # See application-local-secrets.yml.example for the shape.
      secret: ${MODOCUMENT_JWT_SECRET:}
    permit-dev-paths: true
    mfa:
      require-for-admin: false
    maker-checker:
      # Single-developer convenience: template update/delete apply directly
      # instead of waiting for a second user's approval. User-security
      # changes stay maker/checker-gated even here (ws10, never exempt).
      template-changes: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

extraction:
  # Sources/jobs/records persist in the local PostgreSQL and survive restarts.
  store: sql
  kafka:
    enabled: false
