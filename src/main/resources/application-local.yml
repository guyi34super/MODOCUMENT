# Local development without SQL Server: in-memory H2 with the seed data loaded.
# Run with: SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
spring:
  datasource:
    url: jdbc:h2:mem:modocument;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
