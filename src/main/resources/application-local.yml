# Local development without PostgreSQL: in-memory H2 with the seed data loaded.
# Run with: SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
spring:
  autoconfigure:
    # No Mongo/Kafka needed locally: extraction uses in-memory adapters.
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:modocument;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    # Migrations are PostgreSQL-only; H2 gets its schema from ddl-auto: create.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

modocument:
  security:
    jwt:
      # Dev-only signing key; production requires MODOCUMENT_JWT_SECRET.
      secret: modocument-local-dev-secret-change-in-production-0123456789
    permit-dev-paths: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

extraction:
  store: memory
  kafka:
    enabled: false
