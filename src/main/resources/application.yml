server:
  # Trusted-proxy model (SEC-022): Spring's ForwardedHeaderFilter rewrites
  # remoteAddr/scheme/host from X-Forwarded-For/-Proto/-Host, so rate-limit
  # keys, audit IPs and HSTS (needs a "secure" request behind TLS
  # termination) see the real client. ONLY the fronting proxy may set these
  # headers: frontend/nginx.conf OVERWRITES them with its own values
  # ($remote_addr/$scheme) on every proxied request, discarding whatever the
  # client sent — or, behind the AWS ALB (trusted-proxy mode,
  # MODOCUMENT_TRUSTED_PROXY_CIDRS), with the client address and scheme it
  # accepted from that ALB only (docs/security/web-hardening.md §5e). That
  # trust holds only while the app port is NOT reachable
  # directly — production must keep the app behind the proxy (docker-compose
  # no longer publishes 8080; a direct caller could spoof every X-Forwarded-*
  # header wholesale).
  forward-headers-strategy: framework

spring:
  application:
    name: MoDocument
  autoconfigure:
    # ws29 (SE5): no Mongo/Kafka in the default deployment — the production
    # jar does not even ship the clients (Maven `scale` profile only).
    # application-scale.yml clears this list to re-enable them.
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    mongodb:
      # Extraction store (raw pages/payloads, processed records, job state,
      # task queue). Only used when extraction.store=mongo.
      uri: ${EXTRACTION_MONGO_URI:mongodb://localhost:27017/modocument}
  kafka:
    # Extraction work distribution. Only used when extraction.kafka.enabled=true.
    bootstrap-servers: ${EXTRACTION_KAFKA_SERVERS:localhost:9092}
  datasource:
    # Production database: PostgreSQL. Override via MODOCUMENT_DB_* (or the
    # standard SPRING_DATASOURCE_* variables, which take precedence over any
    # profile). MODOCUMENT_DB_* is ignored by the H2 local/test profiles.
    #
    # TWO-ROLE MODEL (row-level security): at runtime the app should connect
    # as the RLS-subject role `modocument_app` (created by V12, policies in
    # V13), while Flyway connects as the schema OWNER below. Table owners
    # bypass the (non-FORCE) policies; modocument_app cannot. Single-user
    # setups keep working — the owner just isn't tenant-filtered, and the
    # TenantAwareJpaTransactionManager still stamps app.tenant either way.
    #
    # DB TLS (ws16, C4/SEC-028 app side): sslmode rides on the URL, so the
    # runtime pool and Flyway (spring.flyway.url below reuses this one)
    # always negotiate the same way. Default `prefer` = TLS whenever the server
    # offers it (local/compose PostgreSQL offers none, so dev keeps working).
    # PRODUCTION: MODOCUMENT_DB_SSLMODE=require (refuse plaintext) or
    # verify-full (+ sslrootcert); a custom MODOCUMENT_DB_URL replaces this
    # whole default, so it must carry its own ?sslmode=… (see README).
    url: ${MODOCUMENT_DB_URL:jdbc:postgresql://localhost:5432/modocument?sslmode=${MODOCUMENT_DB_SSLMODE:prefer}}
    username: ${MODOCUMENT_DB_USERNAME:modocument}
    password: ${MODOCUMENT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    # ws27 (v1.2.0): explicit connection pool sizing instead of Hikari's
    # defaults (10 connections, all of them kept idle).
    #  * maximum-pool-size: one request can hold TWO connections at once —
    #    its own transaction plus a REQUIRES_NEW write (DENIED/FAILED audit
    #    rows, idempotency reservations, settings writes) — and the
    #    integration workers, extraction worker and scheduler threads draw
    #    from the same pool. 20 per task leaves headroom for that; keep
    #    tasks x pool below the database's max_connections (RDS: about
    #    LEAST(DBInstanceClassMemory/9531392, 5000)).
    #  * leak-detection-threshold: a connection held longer than 30 s logs a
    #    WARN with the borrowing stack trace (diagnostic only; the
    #    connection is not taken away). The test profile turns it off.
    hikari:
      maximum-pool-size: ${MODOCUMENT_DB_POOL_MAX:20}
      minimum-idle: ${MODOCUMENT_DB_POOL_MIN_IDLE:5}
      # Milliseconds (bound straight onto HikariDataSource setters).
      connection-timeout: 10000
      leak-detection-threshold: ${MODOCUMENT_DB_LEAK_DETECTION_MS:30000}
      pool-name: modocument-db
  flyway:
    # Flyway owns the schema in production (src/main/resources/db/migration);
    # the H2 local/test profiles disable it and use ddl-auto: create instead.
    # Migrations run as the schema owner: set MODOCUMENT_FLYWAY_USERNAME /
    # MODOCUMENT_FLYWAY_PASSWORD when the datasource user is the restricted
    # `modocument_app` role (docker-compose does); unset, Flyway falls back
    # to the datasource credentials so plain dev setups keep working.
    enabled: true
    # Explicitly the datasource URL — sslmode included, so migrations and the
    # runtime pool negotiate TLS identically (ws16). Explicit, not derived:
    # Boot would otherwise read the URL back from the datasource bean, which
    # the TenantAwareDataSource wrapper hides ("Unable to find suitable
    # method for url" at startup whenever Flyway has its own user).
    url: ${spring.datasource.url}
    user: ${MODOCUMENT_FLYWAY_USERNAME:${spring.datasource.username}}
    password: ${MODOCUMENT_FLYWAY_PASSWORD:${spring.datasource.password}}
    postgresql:
      # ws27: a session-level advisory lock instead of Flyway's transactional
      # one. V270 builds its indexes CONCURRENTLY (non-transactional script),
      # and CREATE INDEX CONCURRENTLY waits for every older transaction —
      # including the lock transaction Flyway would hold open itself, a
      # self-deadlock. The session lock still serialises tasks that start
      # at the same time.
      transactional-lock: false
  jpa:
    open-in-view: false
    hibernate:
      # Flyway creates the schema; Hibernate only checks the mapping against it.
      ddl-auto: validate
      naming:
        # Keep the exact PascalCase table/column names from the original schema.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # ws27: JDBC batching for multi-row writes (saveAll, cascades, dirty
        # entities flushed together). Entities with IDENTITY ids still insert
        # one row per statement (Hibernate needs each generated key back);
        # their UPDATEs and DELETEs batch, as do inserts of entities with
        # assigned ids (UUIDv7 AuditEvent, RefreshToken).
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  task:
    scheduling:
      # ws27: @Scheduled jobs (settings poll, alert sweep, agent offline
      # sweep, integration tick, extraction retry sweeper, retention, SoD,
      # housekeeping) share this pool instead of ONE thread, so a slow job
      # never delays the others. Each job still never overlaps itself. The
      # integration tick additionally hands its work to its own executor
      # (IntegrationScheduler), since outbound dispatch waits on bank
      # endpoints.
      pool:
        size: ${MODOCUMENT_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: modocument-sched-
  servlet:
    multipart:
      max-file-size: 50MB
      # Bulk image upload for document creation sends many photos at once.
      max-request-size: 200MB
  ai:
    openai:
      # Bridged from the aifiles.openai.* keys below so the AIFILES_OPENAI_*
      # and MODOCUMENT_AI_* env vars keep working. LOCAL-FIRST (gate C8): the
      # defaults point at a local Ollama endpoint — no document content leaves
      # the machine unless an operator explicitly opts into an external
      # endpoint via MODOCUMENT_AI_BASE_URL/_API_KEY/_MODEL. The "unset"
      # sentinel lets the auto-configuration boot keyless; the AI gateway
      # rejects LLM calls while it is in place.
      api-key: ${aifiles.openai.api-key:unset}
      base-url: ${aifiles.openai.base-url:http://localhost:11434}
      chat:
        options:
          model: ${aifiles.openai.model-id:qwen2.5}
          max-tokens: ${aifiles.openai.max-tokens:8192}

modocument:
  security:
    jwt:
      # HS256 signing key, at least 32 bytes. REQUIRED in production — the app
      # refuses to start without it (generate one: openssl rand -base64 48).
      # The local/test profiles set their own dev-only secret.
      secret: ${MODOCUMENT_JWT_SECRET:}
      # Access tokens are short-lived; the refresh-cookie rotation flow
      # (/api/auth/refresh) keeps sessions alive. (The legacy ttl-hours key is
      # still honored when set explicitly.)
      ttl-minutes: ${MODOCUMENT_JWT_TTL_MINUTES:15}
    # Permits /swagger/**, /v3/api-docs/** and /h2-console/** without auth.
    # Off in production; the local/test profiles turn it on.
    permit-dev-paths: false
    password:
      # Minimum password length (SEC-021). Length over composition rules; no
      # upper cap beyond the request DTOs' 200-char schema bound, so long
      # passphrases are first-class. The breached-list and email-local-part
      # checks in PasswordPolicy are always on.
      min-length: ${MODOCUMENT_PASSWORD_MIN_LENGTH:12}
    lockout:
      # Wrong-password attempts allowed before the NEXT one locks the account
      # (default 5 → the 6th consecutive failure locks). Lock duration starts
      # at base-minutes and doubles per additional lockout, capped.
      allowed-attempts: ${MODOCUMENT_LOCKOUT_ALLOWED_ATTEMPTS:5}
      base-minutes: ${MODOCUMENT_LOCKOUT_BASE_MINUTES:1}
      cap-minutes: ${MODOCUMENT_LOCKOUT_CAP_MINUTES:30}
    mfa:
      # Encrypts TOTP secrets at rest (AES-256-GCM, key derived via SHA-256).
      # REQUIRED in production (>= 32 bytes, e.g. `openssl rand -base64 48`);
      # the dev/test profiles fall back to a JWT-secret derivation with a
      # logged warning.
      key: ${MODOCUMENT_MFA_KEY:}
      # An ADMIN without activated MFA gets enrollmentRequired at login and
      # cannot obtain an access token until a second factor verifies (B3).
      require-for-admin: ${MODOCUMENT_MFA_REQUIRE_FOR_ADMIN:true}
      # MFA challenge token lifetime (password-to-second-factor window).
      challenge-ttl-minutes: ${MODOCUMENT_MFA_CHALLENGE_TTL_MINUTES:5}
    maker-checker:
      # Dual control on template update/delete (ws10, SEC-023): when true
      # (the default), PUT /Templates/Update and DELETE /Templates/{id}
      # submit a pending change (202) that a DIFFERENT user holding
      # change:approve must approve. A single-user dev setup can turn THIS
      # gate off and apply template changes directly. User-security changes
      # (user creation / role change / disable) are NEVER exempt — they go
      # through maker/checker unconditionally, and self-approval is always
      # a hard 409 (gate B7).
      template-changes: ${MODOCUMENT_MAKER_CHECKER_TEMPLATE_CHANGES:true}
    session:
      # Refresh-session bounds (SUP-S02). Idle: a refresh token UNUSED for
      # this long is refused even when its family is younger than the
      # absolute limit — the newest rotation's IssuedAt is the moment of last
      # use. Absolute: the family's ExpiresAt is fixed at login (7 days) and
      # inherited by every rotation, so refreshing can never extend a session
      # past 7 days from the original sign-in. Duration format: 12h, 30m, 7d.
      idle-timeout: ${MODOCUMENT_SESSION_IDLE_TIMEOUT:12h}
  # OIDC single sign-on (ws07, OPTIONAL — nothing below is active until a
  # provider is configured; the app boots unchanged without any of it).
  # External IdPs only AUTHENTICATE: Entra ID for Microsoft banks, Keycloak
  # for everyone else. MoDocument then issues its own access token + refresh
  # cookie (bridge pattern), so API authentication is unchanged. MFA is
  # enforced AT THE PROVIDER (Entra Conditional Access / the Keycloak realm's
  # TOTP required action). Full shape + setup guide:
  # application-oidc.yml.example and docs/security/identity-providers.md.
  # oidc:
  #   post-login-redirect: /login/complete
  #   providers:
  #     entra:
  #       issuer-uri: https://login.microsoftonline.com/<tenant-id>/v2.0
  #       client-id: ${MODOCUMENT_OIDC_ENTRA_CLIENT_ID}
  #       client-secret: ${MODOCUMENT_OIDC_ENTRA_CLIENT_SECRET}
  #       bank-code: CONTOSO          # Bank.Code users are provisioned into
  #       default-role: READ_ONLY
  #     keycloak:
  #       issuer-uri: http://localhost:8081/realms/modocument
  #       client-id: modocument-app
  #       client-secret: ${MODOCUMENT_OIDC_KEYCLOAK_CLIENT_SECRET}
  #       bank-code: DEFAULT
  #       default-role: READ_ONLY
  #       role-claim: modocument_roles
  cors:
    # Comma-separated list of origins allowed to call the API with credentials.
    # Set to the deployed frontend origin(s) in production.
    allowed-origins: ${MODOCUMENT_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8004,http://localhost:8080,https://localhost:3000,https://localhost:8004,https://localhost:8080}
  api:
    # The servers entry of the generated OpenAPI contract (/v3/api-docs):
    # "/" = same origin as the spec. Set the public API base URL per
    # deployment so generated clients point at the right host.
    server-url: ${MODOCUMENT_API_SERVER_URL:/}
    server-description: ${MODOCUMENT_API_SERVER_DESCRIPTION:This deployment}
  ratelimit:
    # Per-USER fixed-window limits on the expensive endpoints (ws17,
    # SEC-007/gate E2) — one window (default 1h) and a permit count per
    # bucket, enforced by ApiRateLimitInterceptor; over-limit calls answer
    # 429 with Retry-After. ADMINs are NOT exempt: an admin token is exactly
    # as abusable (or stealable) as any other, so abuse containment applies
    # to everyone — ops raise a bucket via its env var instead. Bucket →
    # routes mapping lives in ApiRateLimitInterceptor (table in
    # docs/security/owasp-api-top10.md). Counters are in-memory per
    # instance: N replicas allow up to N x these numbers until the counters
    # move to a shared store.
    enabled: ${MODOCUMENT_RATELIMIT_ENABLED:true}
    window-millis: ${MODOCUMENT_RATELIMIT_WINDOW_MILLIS:3600000}
    max-keys: ${MODOCUMENT_RATELIMIT_MAX_KEYS:100000}
    uploads: ${MODOCUMENT_RATELIMIT_UPLOADS:20}
    ingestion: ${MODOCUMENT_RATELIMIT_INGESTION:60}
    transform: ${MODOCUMENT_RATELIMIT_TRANSFORM:30}
    exports: ${MODOCUMENT_RATELIMIT_EXPORTS:60}
    doc-generate: ${MODOCUMENT_RATELIMIT_DOC_GENERATE:30}
    extraction: ${MODOCUMENT_RATELIMIT_EXTRACTION:30}
    dsr: ${MODOCUMENT_RATELIMIT_DSR:10}
    password-change: ${MODOCUMENT_RATELIMIT_PASSWORD_CHANGE:5}
    mfa-code: ${MODOCUMENT_RATELIMIT_MFA_CODE:10}
    admin-jobs: ${MODOCUMENT_RATELIMIT_ADMIN_JOBS:10}
    admin-security: ${MODOCUMENT_RATELIMIT_ADMIN_SECURITY:10}
  storage:
    # ws29 (SE5) FileStore backend: `local` (default — disk under `root`) or
    # `s3` (ECS: files survive task replacement, shared by every task).
    backend: ${MODOCUMENT_STORAGE_BACKEND:local}
    # Root directory for uploaded files (<root>/uploads) and export copies
    # (<root>/exports) with the local backend. Mount a volume here in containers.
    root: ${MODOCUMENT_STORAGE_ROOT:wwwroot}
    s3:
      # Same key layout as the local root (uploads/..., exports/...), under
      # an optional prefix. Credentials: the AWS default chain (ECS task role).
      bucket: ${MODOCUMENT_STORAGE_S3_BUCKET:}
      prefix: ${MODOCUMENT_STORAGE_S3_PREFIX:}
      # Empty = the AWS default region chain (AWS_REGION on ECS).
      region: ${MODOCUMENT_STORAGE_S3_REGION:}
      # Empty = the bucket's default encryption (Terraform: SSE-KMS, the
      # bucket CMK); set to name the CMK explicitly on every PUT.
      kms-key-id: ${MODOCUMENT_STORAGE_S3_KMS_KEY_ID:}
      # On-disk LRU cache (java.io.tmpdir) for FileStore.localCopy downloads
      # (parsers, LibreOffice), in MiB.
      temp-cache-mb: ${MODOCUMENT_STORAGE_S3_TEMP_CACHE_MB:512}
      # S3-compatible endpoint (MinIO in tests); empty on AWS.
      endpoint: ${MODOCUMENT_STORAGE_S3_ENDPOINT:}
      path-style: ${MODOCUMENT_STORAGE_S3_PATH_STYLE:false}
  privacy:
    masking:
      # ws12 (gate C2, PRIV-005): PII-classified values are ALWAYS masked on
      # exports, generated reports and read-only screens — that is fixed in
      # MaskingPolicy, not configurable. This switch additionally force-masks
      # the owner's own editing wizard (SCREEN_WORKING), which is raw by
      # default because fixing cell values requires seeing them. Matrix and
      # rationale: docs/security/masking-matrix.md.
      screen-working: ${MODOCUMENT_MASK_SCREEN_WORKING:false}
  retention:
    # 30-day automatic deletion of uploaded customer data (ws14, gate C5,
    # PRIV-013). The daily RetentionPurgeJob deletes/anonymizes per bank:
    # uploaded files + rows, ingestion-job row data (job skeleton stays),
    # export archive copies, import raw payloads, extraction bodies and
    # doc-creation content. Full schedule: docs/security/retention-and-dsr.md.
    enabled: ${MODOCUMENT_RETENTION_ENABLED:true}
    customer-data-days: ${MODOCUMENT_RETENTION_DAYS:30}
    # Daily, off-peak; six-field Spring cron (seconds first).
    cron: ${MODOCUMENT_RETENTION_CRON:0 41 2 * * *}
  housekeeping:
    # ws27 (v1.2.0) daily housekeeping (HousekeepingJob): deletes RefreshToken
    # rows expired/revoked > 30 days ago, RevokedToken rows past their token
    # expiry, finished integration runs (+ run logs), DELIVERED/DEAD outbox
    # rows and integration events older than each bank's
    # integration.historyRetention setting (default 90 days), and expired
    # Idempotency-Key rows. Audited HOUSEKEEPING_COMPLETED per bank (counts).
    # The flag gates only the schedule.
    enabled: ${MODOCUMENT_HOUSEKEEPING_ENABLED:true}
    # Daily, after the retention purge and the SoD scan; six-field Spring cron.
    cron: ${MODOCUMENT_HOUSEKEEPING_CRON:0 7 4 * * *}
    # Bounded per run: at most batch-size x max-batches rows per rule and
    # bank, one short transaction per batch; a backlog drains over days.
    batch-size: 500
    max-batches: 100
    refresh-token-grace: 30d
    revoked-token-grace: 5m
  sod:
    # Nightly separation-of-duties scan (ws11, SEC-024 layer 3): re-verifies
    # per bank that no APPLIED change was approved by its own maker and no
    # RELEASED document was released by its author or submitter, writing
    # SOD_SCAN_COMPLETED / SOD_VIOLATION_FOUND audit evidence. The flag
    # gates only the schedule; POST /api/admin/sod/scan always runs.
    enabled: ${MODOCUMENT_SOD_SCAN_ENABLED:true}
    # Daily, off-peak, after the retention purge; six-field Spring cron.
    cron: ${MODOCUMENT_SOD_SCAN_CRON:0 23 3 * * *}
  export:
    # ws18 (gate D2, PRIV-002): per-role export row caps. Above the cap a
    # file/database export is REFUSED (403 EXPORT_CAP_EXCEEDED, audited
    # EXPORT_BLOCKED, alerted immediately) unless the user states a reason
    # (<= 500 chars) - then it proceeds, audited EXPORT_OVER_CAP_WITH_REASON
    # (reason verbatim) and alerted as informational. A role without an
    # entry has cap 0 (fail closed). Details:
    # docs/security/alerting-and-export-caps.md.
    caps:
      READ_WRITE: ${MODOCUMENT_EXPORT_CAP_READ_WRITE:5000}
      ADMIN: ${MODOCUMENT_EXPORT_CAP_ADMIN:50000}
      # ws26: GET /api/integration/v1/jobs/{id}/results (no reason path for
      # machines: above the cap the read is refused, 403 EXPORT_CAP_EXCEEDED).
      API_CLIENT: ${MODOCUMENT_EXPORT_CAP_API_CLIENT:50000}
    reason-max-length: 500
  alerts:
    # ws18 alert framework (gate D1, SEC-032). The audit trail is the single
    # event source: IMMEDIATE rules fire post-commit on one audit row,
    # WINDOWED rules are aggregates evaluated by a sweep every minute. A
    # burst raises ONE alert per rule window (dedupe per rule/bank/group).
    # Every alert is recorded in AlertLog (admin panel: Administration >
    # Security alerts) and delivered to: the log (always - WARN on logger
    # modocument.security.alert, tag SECURITY_ALERT, visible to a SIEM via
    # structured logs), the webhook (the phone path: Slack/Teams/WhatsApp
    # bridge/PagerDuty) and e-mail, when configured. Catalogue rationale:
    # docs/security/alerting-and-export-caps.md.
    enabled: ${MODOCUMENT_ALERTS_ENABLED:true}
    sweep:
      # Gates the SCHEDULE only (the sweep can always be run directly).
      enabled: ${MODOCUMENT_ALERTS_SWEEP_ENABLED:true}
      interval-ms: ${MODOCUMENT_ALERTS_SWEEP_INTERVAL_MS:60000}
    delivery:
      attempts: 2
      # The sweep retries a failing channel this long, then marks FAILED.
      retry-window: ${MODOCUMENT_ALERTS_RETRY_WINDOW:30m}
    webhook:
      # Operator configuration (never user input), so it deliberately
      # bypasses the user-URL SSRF policy - see WebhookAlertChannel.
      url: ${MODOCUMENT_ALERTS_WEBHOOK_URL:}
      # Optional: signs each body (X-MoDocument-Signature: sha256=<hmac>).
      secret: ${MODOCUMENT_ALERTS_WEBHOOK_SECRET:}
      min-severity: ${MODOCUMENT_ALERTS_WEBHOOK_MIN_SEVERITY:INFO}
    email:
      # Comma-separated recipients; needs spring.mail.host as well
      # (SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD). Off when either is unset.
      to: ${MODOCUMENT_ALERTS_EMAIL_TO:}
      from: ${MODOCUMENT_ALERTS_EMAIL_FROM:modocument-alerts@localhost}
      min-severity: ${MODOCUMENT_ALERTS_EMAIL_MIN_SEVERITY:INFO}
    # THE RULE CATALOGUE (SEC-032 configurable thresholds). Replacing this
    # list replaces the catalogue; to tune a default, use its env variable.
    # trigger: IMMEDIATE | WINDOWED; group-by: ACTOR | IP | ENTITY | BANK;
    # window: aggregation window (WINDOWED) and dedupe window (both), 1m-24h;
    # actions: audit actions ("*" = any); outcomes / actor-roles: optional.
    rules:
      - name: account-locked
        description: Account locked after repeated wrong passwords
        trigger: IMMEDIATE
        actions: [ACCOUNT_LOCKED]
        group-by: ACTOR
        window: 5m
        severity: HIGH
      - name: refresh-token-reuse
        description: Rotated refresh token replayed - session family revoked (possible token theft)
        trigger: IMMEDIATE
        actions: [TOKEN_REFRESH_REUSE_DETECTED]
        group-by: ACTOR
        window: 5m
        severity: CRITICAL
      - name: export-blocked
        description: Export above the role row cap refused (no reason stated)
        trigger: IMMEDIATE
        actions: [EXPORT_BLOCKED]
        group-by: ACTOR
        window: 5m
        severity: HIGH
      - name: export-over-cap
        description: Large export above the role row cap, allowed with a stated reason
        trigger: IMMEDIATE
        actions: [EXPORT_OVER_CAP_WITH_REASON]
        group-by: ENTITY
        window: 5m
        severity: INFO
      - name: sod-violation
        description: Segregation-of-duties violation found by the nightly scan
        trigger: IMMEDIATE
        actions: [SOD_VIOLATION_FOUND]
        group-by: ENTITY
        window: 5m
        severity: CRITICAL
      - name: sod-attempt-blocked
        description: Self-approval / self-release attempt blocked
        trigger: IMMEDIATE
        actions: [SELF_APPROVAL_BLOCKED, DOC_SELF_RELEASE_BLOCKED]
        group-by: ACTOR
        window: 15m
        severity: MEDIUM
      - name: ai-prompt-refused
        description: AI gateway refused a cross-bank prompt (one-bank rule)
        trigger: IMMEDIATE
        actions: [AI_PROMPT_REFUSED]
        group-by: ACTOR
        window: 5m
        severity: HIGH
      - name: ai-output-blocked
        description: AI reply withheld by the output policy
        trigger: IMMEDIATE
        actions: [AI_OUTPUT_BLOCKED]
        group-by: ACTOR
        window: 15m
        severity: MEDIUM
      - name: privileged-change
        description: Privileged (admin/root) action
        trigger: IMMEDIATE
        actions: [BOOTSTRAP_ADMIN_CREATED, USER_ROLE_CHANGED, MFA_DISABLED, USER_LIST_EXPORTED, DSR_EXPORTED, DSR_ERASED, USER_PASSWORD_RESET, USER_MFA_RESET]
        group-by: ACTOR
        window: 5m
        severity: MEDIUM
      - name: admin-login
        description: Administrator signed in (privileged account in use)
        trigger: IMMEDIATE
        actions: [LOGIN_SUCCESS]
        actor-roles: [ADMIN]
        group-by: ACTOR
        window: ${MODOCUMENT_ALERT_ADMIN_LOGIN_WINDOW:60m}
        severity: LOW
      - name: login-failures-per-user
        description: Repeated failed logins against one account
        trigger: WINDOWED
        actions: [LOGIN_FAILED]
        group-by: ACTOR
        threshold: ${MODOCUMENT_ALERT_LOGIN_FAILURES_PER_USER:5}
        window: ${MODOCUMENT_ALERT_LOGIN_FAILURES_WINDOW:5m}
        severity: HIGH
      - name: login-failures-per-ip
        description: Repeated failed logins from one network address
        trigger: WINDOWED
        actions: [LOGIN_FAILED]
        group-by: IP
        threshold: ${MODOCUMENT_ALERT_LOGIN_FAILURES_PER_IP:5}
        window: ${MODOCUMENT_ALERT_LOGIN_FAILURES_WINDOW:5m}
        severity: HIGH
      - name: authorization-denied-burst
        description: Repeated access-denied responses for one user
        trigger: WINDOWED
        actions: [AUTHORIZATION_DENIED]
        group-by: ACTOR
        threshold: ${MODOCUMENT_ALERT_AUTHZ_DENIED_THRESHOLD:10}
        window: 5m
        severity: MEDIUM
      - name: admin-action-burst
        description: Burst of administrator actions
        trigger: WINDOWED
        actions: ["*"]
        actor-roles: [ADMIN]
        outcomes: [SUCCESS]
        group-by: ACTOR
        threshold: ${MODOCUMENT_ALERT_ADMIN_BURST_THRESHOLD:30}
        window: 10m
        severity: MEDIUM
      - name: export-burst
        description: Many exports by one user (cap evasion by splitting)
        trigger: WINDOWED
        actions: [EXPORT_RUN]
        group-by: ACTOR
        threshold: ${MODOCUMENT_ALERT_EXPORT_BURST_THRESHOLD:5}
        window: 10m
        severity: MEDIUM
      # ws20 settings: an approved maker/checker change of a security-tier
      # setting (one audit row per key; grouped per approving user).
      - name: security-setting-changed
        description: Security setting changed (maker/checker approved)
        trigger: IMMEDIATE
        actions: [SECURITY_SETTING_UPDATED]
        group-by: ACTOR
        window: 5m
        severity: MEDIUM
      # ws20/ws21: the platform owner changed a global default or the range
      # a bank may choose from (affects every bank), bootstrapped the
      # platform, onboarded / suspended / reactivated a bank, added a
      # break-glass admin to one, or (ws25, wave 3) approved an egress rule.
      # Grouped per audited entity (the bank, the setting): each bank
      # lifecycle action is audited in the customer bank AND the platform
      # bank, so both sides get their own alert.
      - name: platform-change
        description: Platform setting, bank bound, bank lifecycle, egress approval or platform bootstrap by the platform owner
        trigger: IMMEDIATE
        actions: [PLATFORM_SETTING_UPDATED, PLATFORM_BOOTSTRAPPED, BANK_ONBOARDED, BANK_SUSPENDED, BANK_REACTIVATED, BANK_ADMIN_ADDED, EGRESS_RULE_APPROVED]
        group-by: ENTITY
        window: 5m
        severity: HIGH
      # ws23: many jobs of one bank fell back from AI to code extraction
      # (provider outage, quota, invalid output) - code-extracted data needs
      # review, and a silent provider failure must reach a person. Threshold
      # and window are platform settings (alerts.parseFallbackSurge.*).
      - name: parse-fallback-surge
        description: Surge of ingestion jobs parsed by the code fallback instead of the AI
        trigger: WINDOWED
        actions: [INGESTION_PARSE_FALLBACK]
        group-by: BANK
        threshold: ${MODOCUMENT_ALERT_PARSE_FALLBACK_SURGE_THRESHOLD:20}
        window: 1h
        severity: MEDIUM
      # ws23: the AI circuit breaker opened (consecutive transport/5xx/timeout
      # failures) - every AI feature degrades to its code fallback until the
      # trial call succeeds.
      - name: ai-circuit-opened
        description: AI circuit breaker opened - AI calls suspended, code fallbacks in use
        trigger: IMMEDIATE
        actions: [AI_CIRCUIT_OPENED]
        group-by: BANK
        window: 15m
        severity: HIGH
      # ws26: repeated failed API client authentications (bad secret/key,
      # unknown or untrusted certificate, revoked/expired client, CIDR
      # mismatch) from one address - credential stuffing against the
      # integration API.
      - name: api-client-auth-failures
        description: Repeated API client authentication failures from one address
        trigger: WINDOWED
        actions: [API_CLIENT_AUTH_FAILED]
        group-by: IP
        threshold: ${MODOCUMENT_ALERT_API_CLIENT_AUTH_FAILURES:10}
        window: 5m
        severity: HIGH
      # ws24: a new release reached this installation (one VERSION_DEPLOYED
      # row per bank; banks are told through the RELEASE announcement too).
      - name: version-deployed
        description: A new MoDocument version was deployed
        trigger: IMMEDIATE
        actions: [VERSION_DEPLOYED]
        group-by: BANK
        window: 1h
        severity: INFO
      # ws24: the platform owner published or archived an announcement
      # (system RELEASE banners are written by the recorder, not a person).
      - name: announcement-change
        description: Platform announcement published or archived by a platform admin
        trigger: IMMEDIATE
        actions: [ANNOUNCEMENT_PUBLISHED, ANNOUNCEMENT_ARCHIVED]
        actor-roles: [PLATFORM_ADMIN]
        group-by: ACTOR
        window: 5m
        severity: MEDIUM
      # ws25 (SE4): integration runs failing repeatedly in one bank (a bank
      # system down, rotated credentials, a changed table).
      - name: integration-failures
        description: Repeated integration run failures
        trigger: WINDOWED
        actions: [INTEGRATION_RUN_FAILED]
        group-by: BANK
        threshold: ${MODOCUMENT_ALERT_INTEGRATION_FAILURES_THRESHOLD:5}
        window: 1h
        severity: MEDIUM
      # ws25 (SE4): an outbound delivery gave up after its retries - data the
      # bank expects did not arrive; replay it from the run page.
      - name: integration-dead-letter
        description: Outbound integration delivery dead-lettered
        trigger: IMMEDIATE
        actions: [INTEGRATION_DELIVERY_DEAD]
        group-by: BANK
        window: 15m
        severity: HIGH
      # ws26 (SE5, wave 4): a Connector Agent missed its heartbeats for
      # longer than the bank's integration.agentHeartbeatTimeout. The
      # AgentOfflineSweep writes AGENT_OFFLINE once per ONLINE -> OFFLINE
      # transition; grouped per agent, so a flapping agent alerts at most
      # once per window.
      - name: agent-offline
        description: Connector Agent offline (no heartbeat within the bank's timeout)
        trigger: IMMEDIATE
        actions: [AGENT_OFFLINE]
        group-by: ENTITY
        window: 30m
        severity: MEDIUM
  settings:
    # ws20 editable settings (docs/settings/catalogue.md). The catalogue,
    # types and hard limits are code; administrators' values live in the
    # BankSetting table. Each task polls the ConfigRevision counter this
    # often and reloads its in-memory snapshot when another task wrote a
    # setting (not itself an editable setting).
    poll-interval-ms: ${MODOCUMENT_SETTINGS_POLL_INTERVAL_MS:5000}
    # Staging/production: refuse to start when a shipped default (this file
    # or its env override) lies outside its setting's hard limits; off, each
    # violation is a startup WARN and the configured value stays in force.
    enforce-guardrails: ${MODOCUMENT_SETTINGS_ENFORCE_GUARDRAILS:false}
  platform:
    # Phase 2 (ws21): the platform owner's (MO Intelligence) own bank, found
    # by this code (and Kind = PLATFORM). Platform settings, announcements and
    # egress approvals are rows of this bank; only its users may hold the
    # platform:* permissions. PlatformBankLookup caches the resolved id for
    # bank-cache-ttl (the test profile uses 0s).
    bank-code: ${MODOCUMENT_PLATFORM_BANK_CODE:MOI-PLATFORM}
    bank-cache-ttl: 30s
  integration:
    # ws25 Bank Integration Hub. Connection secrets (DIRECT mode) are sealed
    # with AES-256-GCM under a per-bank key derived (HKDF-SHA256) from this
    # master key - SEPARATE from the MFA key. Base64 of exactly 32 bytes
    # (`openssl rand -base64 32`). Unset: the app starts, but storing or
    # using a connection secret is refused. Rotation (new active version,
    # old keys kept readable): docs/integration/secrets.md.
    connector-key: ${MODOCUMENT_CONNECTOR_KEY:}
    connector-key-version: ${MODOCUMENT_CONNECTOR_KEY_VERSION:1}
    # Retired keys, still accepted for opening: "1:<base64>,2:<base64>".
    connector-retired-keys: ${MODOCUMENT_CONNECTOR_RETIRED_KEYS:}
    # BankEgressGuard caches each bank's APPROVED egress rules this long
    # (approving/revoking a rule on this task invalidates at once).
    egress-rule-cache-ttl: 30s
    # ws26 machine identity + Integration API v1 (docs/integration/
    # developer-guide.md). The per-bank security values (client token
    # lifetime, allowed auth methods) are SETTINGS (integration.*); these
    # are deployment-level.
    clients:
      # TCP peers whose X-Amzn-Mtls-Clientcert-* headers are trusted: the
      # proxy hop in front of the app (frontend nginx, which forwards them
      # only from the trusted ALB). Empty = mutual TLS is never accepted.
      # Comma-separated CIDRs (e.g. 127.0.0.1/32 on ECS, the compose network).
      mtls-trusted-proxy-cidrs: ${MODOCUMENT_MTLS_TRUSTED_PROXY_CIDRS:}
      api-key-cache-ttl: 60s
      # Argon2id verifications (token endpoint + API-key cache misses) per IP.
      verify-per-ip-max: ${MODOCUMENT_INTEGRATION_VERIFY_PER_IP:60}
      verify-window: 15m
      secret-overlap: 24h
      initial-secret-ttl: 24h
      default-expiry: 365d
      max-expiry: 1095d
    api:
      # Requests per API client per window on /api/integration/v1/**.
      per-client-max: ${MODOCUMENT_INTEGRATION_PER_CLIENT_MAX:600}
      window: 1m
      token-per-ip-max: ${MODOCUMENT_INTEGRATION_TOKEN_PER_IP:120}
      max-body-bytes: 10485760
      max-records: 10000
      max-file-bytes: 26214400
      idempotency-ttl: 24h
      events-default-limit: 100
      events-max-limit: 500
  agent:
    # ws26 on-prem Connector Agent (docs/integration/agent.md). The URL the
    # agent is told to call (docker command, token URL); empty = the
    # request's own base URL (nginx pins the forwarded host).
    public-url: ${MODOCUMENT_AGENT_PUBLIC_URL:}
    # Image in the dashboard's docker command; tagged with the running version.
    image: ${MODOCUMENT_AGENT_IMAGE:ghcr.io/guyi34super/modocument-agent}
    # One-time enrolment token lifetime (1s-60m).
    enrolment-ttl: 15m
    enrol-rate-limit:
      per-ip-max: 10
      window-millis: 900000
    # GET /api/agent/v1/tasks: no request thread waits; one scheduler thread
    # re-tries the claim of every waiting agent every interval.
    long-poll:
      interval-millis: 2000
      max-waiters: 500
      max-tasks: 10
    max-records-per-post: 1000
    # Wave 4: marks agents silent for longer than the bank's
    # integration.agentHeartbeatTimeout OFFLINE (audit AGENT_OFFLINE, alert
    # agent-offline). `enabled` gates only the schedule.
    offline-sweep:
      enabled: ${MODOCUMENT_AGENT_OFFLINE_SWEEP_ENABLED:true}
      interval-ms: 60000
  siem:
    # ws18 SIEM export (SEC-031, gate E6). Schema + transports:
    # docs/security/siem-event-schema.md.
    feed:
      # GET /api/siem/events (siem:read, ADMIN): the caller's bank only.
      # Events younger than `settle` wait one poll (in-flight transactions).
      settle: ${MODOCUMENT_SIEM_FEED_SETTLE:5s}
      default-limit: 500
      max-limit: 1000
    webhook:
      # Optional push (NDJSON batches). SINGLE-BANK deployments only: set
      # bank-code to the one bank whose events are pushed; multi-bank
      # deployments use the pull feed per bank.
      url: ${MODOCUMENT_SIEM_WEBHOOK_URL:}
      bank-code: ${MODOCUMENT_SIEM_WEBHOOK_BANK_CODE:}
      secret: ${MODOCUMENT_SIEM_WEBHOOK_SECRET:}
      batch-size: 100
      queue-capacity: 10000
  probe:
    # ws18 (SUP-S11): public synthetic probe GET /api/probe/synthetic.
    rate-limit:
      per-ip-max: ${MODOCUMENT_PROBE_RATE_LIMIT:60}
      window-millis: 60000
  parsing:
    llm-batch-size: ${PARSING_LLM_BATCH_SIZE:50}
    llm-single-pass-max-rows: ${PARSING_LLM_SINGLE_PASS_MAX_ROWS:150}
    llm-batch-concurrency: ${PARSING_LLM_BATCH_CONCURRENCY:8}
    deterministic-enabled: ${PARSING_DETERMINISTIC_ENABLED:true}
    combined-extraction-mapping: ${PARSING_COMBINED_EXTRACTION_MAPPING:true}
    excel:
      # When false, Excel workbooks use the fast POI parser instead of LLM
      # serialization — typically seconds instead of minutes for large sheets.
      llm-enabled: ${EXCEL_LLM_ENABLED:false}
  job:
    wait-timeout-seconds: ${MODOCUMENT_JOB_WAIT_TIMEOUT_SECONDS:900}
    poll-interval-ms: ${MODOCUMENT_JOB_POLL_INTERVAL_MS:500}
  chat-edit:
    # Reject a full-table AI edit (no validation errors) when a non-bulk
    # instruction would change more than this fraction of cells (0.6 = 60%).
    # Bulk phrasing ("all"/"every") is exempt.
    full-table-max-change-ratio: ${MODOCUMENT_CHAT_EDIT_MAX_CHANGE_RATIO:0.6}
    # Model for validation-step chat edits (Ollama: deepseek-r1:8b).
    model-id: ${MODOCUMENT_CHAT_EDIT_MODEL:deepseek-r1:8b}
  extraction-llm:
    # Agentic extraction: schema inference, run summaries, record cleaning.
    # Uses the same local Ollama endpoint as document parsing (AIFILES_OPENAI_BASEURL).
    model-id: ${MODOCUMENT_EXTRACTION_MODEL:mistral:latest}
  doccreation:
    # Headless LibreOffice for the document-creation PDF export. Installed in
    # the Docker image; when the binary is absent (e.g. local dev) the .docx
    # download keeps working and the PDF endpoint answers 409.
    soffice-path: ${MODOCUMENT_DOCCREATION_SOFFICE_PATH:soffice}
    soffice-timeout-seconds: ${MODOCUMENT_DOCCREATION_SOFFICE_TIMEOUT_SECONDS:120}
    # AI-driven blueprint breakdown: the LLM reads the document's paragraph
    # listing and identifies every logical section (headings in any disguise).
    # Falls back to the heuristic heading parser when disabled, when no API
    # key is configured, or when the model's reply doesn't validate.
    section-ai-enabled: ${MODOCUMENT_DOCCREATION_SECTION_AI:true}
    # Model for the breakdown; empty uses the global aifiles.openai.model-id.
    section-model-id: ${MODOCUMENT_DOCCREATION_SECTION_MODEL:}
    # AI-composed generation: the LLM is given the template plus everything
    # the user added and returns the complete final document as an assembly
    # plan, validated to reproduce the template exactly. The deterministic
    # engine carries generation whenever AI is disabled, unconfigured, over
    # quota, or the plan doesn't validate.
    generate-ai-enabled: ${MODOCUMENT_DOCCREATION_GENERATE_AI:true}
    # Model for composition; empty uses the global aifiles.openai.model-id.
    generate-model-id: ${MODOCUMENT_DOCCREATION_GENERATE_MODEL:}

management:
  endpoints:
    web:
      exposure:
        # Health only — for container healthchecks and load-balancer probes.
        include: health
  health:
    mongo:
      # The default extraction store is SQL, so an absent Mongo must not
      # drag /actuator/health DOWN. The scale profile re-enables this check.
      enabled: false
    mail:
      # ws18: the SMTP server only carries alert e-mails; its outage must
      # not mark the application DOWN (the alert log + retries cover it).
      enabled: false

aifiles:
  openai:
    # LOCAL AI BY DEFAULT (gate C8): a local Ollama endpoint needs no real
    # key, so 'ollama' here means "the local default is usable as-is". An
    # EXTERNAL endpoint is an explicit opt-in: set MODOCUMENT_AI_BASE_URL +
    # MODOCUMENT_AI_API_KEY + MODOCUMENT_AI_MODEL (the legacy AIFILES_OPENAI_*
    # names keep working), or put the values in an application-local.yml
    # (gitignored). Setting the key to an empty string disables the LLM
    # endpoints entirely (the spring.ai bridge falls back to its "unset"
    # sentinel and the AI gateway refuses calls).
    api-key: ${MODOCUMENT_AI_API_KEY:${AIFILES_OPENAI_APIKEY:ollama}}
    base-url: ${MODOCUMENT_AI_BASE_URL:${AIFILES_OPENAI_BASEURL:http://localhost:11434}}
    # Default chat model (qwen2.5 on Ollama); extraction agents default to
    # mistral and chat edits to deepseek-r1:8b (modocument.* keys below).
    model-id: ${MODOCUMENT_AI_MODEL:${AIFILES_OPENAI_MODELID:qwen2.5}}
  privacy:
    # PII tokenization for the LLM chat/analysis features (chat table edits,
    # schema inference, extraction summaries, LLM record cleaning, template
    # classification). FAIL CLOSED: enabled by default — sensitive cell values
    # are replaced with [NAME_1]/[EMAIL_2]-style placeholders before any
    # prompt leaves the backend, and the placeholders are swapped back in the
    # model's answer. Disable only if your LLM endpoint is trusted end to end.
    tokenize-pii: ${AIFILES_PRIVACY_TOKENIZEPII:true}
    # Extra column names to always treat as sensitive, matched case- and
    # punctuation-insensitively as substrings (e.g. "badge" matches
    # "BadgeNumber").
    extra-sensitive-fields: []

mapping:
  # Tiered column mapping. Deterministic code tiers always run first:
  # exact name -> normalized name -> aliases/token similarity -> value-shape
  # scoring through the template's own validation rules and data types ->
  # mappings learned from this template's past completed jobs -> threshold-
  # gated unique assignment. The LLM is asked only about columns those tiers
  # leave unresolved, and its prompt carries column/field NAMES only — never
  # data values. Set to false for a fully code-only mapping flow.
  llm-fallback-enabled: ${MAPPING_LLMFALLBACK_ENABLED:true}
  llm-scope: ${MAPPING_LLM_SCOPE:unresolved}
  llm-sample-size: ${MAPPING_LLM_SAMPLE_SIZE:5}
  # Minimum candidate score (0-1) for a code-tier match to be accepted;
  # anything below stays unmapped for review in the mapping step.
  confidence-threshold: 0.7
  # Non-blank sample values per column examined by the value-shape tier.
  sample-size: 20
  # Recent completed jobs consulted by the learned-mappings tier.
  history-jobs: 25
  # Extra header aliases (normalized token -> canonical token), merged with
  # the built-in table, e.g. { matricule: employeenumber }.
  aliases: {}

docling:
  # Optional docling-serve endpoint (e.g. http://localhost:5001). When empty,
  # documents are parsed with the built-in readers (POI/CSV/PDFBox + OCR).
  base-url: ${DOCLING_BASEURL:}

ocr:
  vision:
    # LLM vision OCR for standalone images and scanned PDF pages. OFF BY
    # DEFAULT (gate C8): page images cannot be pseudonymised the way text
    # prompts are, so sending them to a vision model is an explicit opt-in
    # (OCR_VISION_ENABLED=true plus a vision-capable model/endpoint). The
    # local Tesseract OCR tier remains the default for scanned content.
    enabled: ${OCR_VISION_ENABLED:false}
    model: ${OCR_VISION_MODEL:qwen2.5vl}
    # Vision-OCR page budget per PDF; pages beyond it fall back to Tesseract.
    max-pages: ${OCR_VISION_MAXPAGES:20}
    # Rasterization DPI for scanned pages and the longest image edge uploaded;
    # larger images are downscaled first (the upload size/cost control).
    dpi: 200
    max-dimension: 2048

extraction:
  # Where extraction data (sources, jobs, raw/processed records, audit,
  # connector state) lives. "sql" (default) persists it in the primary
  # database, owned per user, so it survives restarts with no extra services;
  # "memory" is for tests, "mongo" (or the scale profile) for multi-instance
  # runs. With "sql" the in-flight task queue stays in memory — jobs
  # interrupted by a restart are marked FAILED at startup and can be re-run.
  store: ${EXTRACTION_STORE:sql}
  kafka:
    # When enabled, task-available events are published to Kafka so any
    # instance in the consumer group can claim the task from the store. When
    # disabled, workers poll the store queue directly.
    enabled: ${EXTRACTION_KAFKA_ENABLED:false}
  worker:
    enabled: true
    threads: 4
    lease-seconds: 60
    poll-millis: 500
    shutdown-grace-seconds: 20
    max-attempts: 4
    backoff-millis: 5000
    sweep-millis: 15000
  batch-size: 500
  web:
    # Honest bot identity sent on every request; set the contact URL to a page
    # describing your crawler before extracting at scale.
    user-agent: "MoDocumentBot/1.0 (+https://example.com/bot)"
    default-delay-millis: 1000
    robots-ttl-seconds: 3600
    max-body-bytes: 5242880
    request-timeout-seconds: 20
    # No effect since ws29: JS rendering (Playwright) was removed.
    render-js-enabled: false
    max-pages-default: 100
    max-depth-default: 2

springdoc:
  # Spec GENERATION is on in every profile (SEC-006): /v3/api-docs is the
  # authoritative machine-readable contract, derived from the code, and
  # OpenApiContractTest pins its route inventory (docs/api/openapi-routes.txt)
  # in CI. Exposure decision (docs/api/versioning-policy.md): outside dev
  # (permit-dev-paths off) the endpoint requires a valid bearer token like
  # every non-login route — no anonymous reconnaissance; any authenticated
  # role may read it, because the route list is no secret from a signed-in
  # user (the SPA bundle carries it) and every route enforces its own
  # permission. A deployment that wants no spec endpoint at all sets
  # MODOCUMENT_API_DOCS_ENABLED=false (CI still validates the contract).
  # The Swagger UI stays a development tool — enabled only by the local
  # profile.
  api-docs:
    enabled: ${MODOCUMENT_API_DOCS_ENABLED:true}
  # Deterministic key order, so two spec downloads diff cleanly.
  writer-with-order-by-keys: true
  swagger-ui:
    enabled: false

logging:
  level:
    root: info

---
# Structured logging (E9/SEC-015): activate the `structured-logs` profile
# (e.g. SPRING_PROFILES_ACTIVE=structured-logs) to switch the console
# appender in logback-spring.xml from the human-readable pattern (the
# default, extended with [requestId] [u:userId b:bankId] from the MDC) to
# Spring Boot's native structured output for log aggregation. The document
# format defaults to Elastic Common Schema and can be overridden with
# MODOCUMENT_LOG_FORMAT (ecs | logstash | gelf). MDC keys — requestId, ip
# (RequestIdFilter), userId, role (IdentityContextFilter), bankId
# (TenantContext; '*' for system work) — become fields of every document.
spring:
  config:
    activate:
      on-profile: structured-logs
logging:
  structured:
    format:
      console: ${MODOCUMENT_LOG_FORMAT:ecs}
    json:
      # ws13 (PRIV-005 log part, SEC-019): the structured encoder bypasses
      # the logback pattern converters, so PII/credential masking is applied
      # to every string member of each JSON document (message, error.message,
      # error.stack_trace, …) through this customizer instead. Same pattern
      # set as the %mask/%maskEx conversion words in logback-spring.xml.
      customizer: com.modocument.infrastructure.logging.RedactingJsonMembersCustomizer

---
# ============================================================================
# ws23 (SE4, phase 2) — AI client resilience (QA finding OBS-03).
# Kept in its own YAML document, outside the ws20 settings and alert blocks
# above; it carries no profile condition, so it applies in every profile.
# Infrastructure wiring, not editable settings (docs/settings/catalogue.md).
#
# Before this block Spring AI's defaults applied: 10 attempts with a 2 s x5
# backoff (capped at 3 min) on every 5xx — about 19 minutes before a failing
# model reached the code fallback — and an HTTP client without a read
# timeout, so a hung model held a job forever. Now a model 500 is retried
# once after 1 s, a timeout or refused connection is not retried at all
# (Spring AI retries only TransientAiException, i.e. 5xx), and the parse
# stage falls back to code within seconds (AI_WITH_CODE_FALLBACK, the
# default mode). Five such failures in a row open the AI circuit breaker
# (platform settings ai.circuitBreaker.*): AI calls are then refused at once.
# ============================================================================
spring:
  ai:
    retry:
      # Total attempts per model call (1 = no retry). Only 5xx answers are
      # retried; 4xx answers, transport failures and timeouts never are.
      max-attempts: ${MODOCUMENT_AI_RETRY_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: ${MODOCUMENT_AI_RETRY_INITIAL_INTERVAL:1s}
        multiplier: 2
        max-interval: ${MODOCUMENT_AI_RETRY_MAX_INTERVAL:5s}
modocument:
  ai:
    http:
      # AiHttpClientConfig: timeouts of the HTTP client under the AI client
      # (Spring Boot's default client has none).
      connect-timeout: ${MODOCUMENT_AI_CONNECT_TIMEOUT:5s}
      # One model reply. A local model writing a long table can need
      # minutes; raise it for slow hardware rather than lose good answers.
      read-timeout: ${MODOCUMENT_AI_READ_TIMEOUT:120s}
    extraction:
      # Batched LLM extraction of one document may spend this long in
      # AI_WITH_CODE_FALLBACK mode; batches not started by then are parsed
      # by code (ParsedBy AI_PARTIAL, reason TIMEOUT).
      time-budget: ${MODOCUMENT_AI_EXTRACTION_TIME_BUDGET:10m}

---
# ============================================================================
# ws25 (SE4, phase 2) - Bank Integration Hub: connectors and flow engine.
# Infrastructure wiring only; the editable knobs are the settings catalogue's
# integration.* keys (max rows per run, run timeout, minimum schedule
# interval, webhook retry attempts, outbound PII masking default).
# ============================================================================
modocument:
  integration:
    connectors:
      # Every connector call (HTTP, JDBC, SFTP) has both timeouts.
      connect-timeout: ${MODOCUMENT_INTEGRATION_CONNECT_TIMEOUT:10s}
      read-timeout: ${MODOCUMENT_INTEGRATION_READ_TIMEOUT:30s}
      # Largest SFTP file pulled or pushed, and largest HTTP response read.
      max-file-bytes: ${MODOCUMENT_INTEGRATION_MAX_FILE_BYTES:52428800}
      max-response-bytes: ${MODOCUMENT_INTEGRATION_MAX_RESPONSE_BYTES:20971520}
      # Plain http:// REST/WEBHOOK targets. Never in staging/production:
      # credentials and records must not travel unencrypted.
      allow-plain-http: false
    engine:
      # IntegrationScheduler tick: due SCHEDULE flows, run timeouts, outbox.
      scheduler-enabled: ${MODOCUMENT_INTEGRATION_SCHEDULER_ENABLED:true}
      tick-ms: 30000
      # Threads executing runs (each holds one connection to a bank system).
      worker-threads: ${MODOCUMENT_INTEGRATION_WORKER_THREADS:4}
      # Outbox: deliveries claimed per bank per tick, the claim lease, and
      # the exponential retry backoff (30 s, 1 m, 2 m, ... capped at 1 h).
      dispatch-batch-size: 50
      dispatch-lease: 2m
      base-backoff: 30s
      max-backoff: 1h
      read-page-size: 1000
