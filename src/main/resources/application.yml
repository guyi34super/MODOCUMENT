spring:
  application:
    name: MoDocument
  data:
    mongodb:
      # Extraction store (raw pages/payloads, processed records, job state,
      # task queue). Only used when extraction.store=mongo.
      uri: ${EXTRACTION_MONGO_URI:mongodb://localhost:27017/modocument}
  kafka:
    # Extraction work distribution. Only used when extraction.kafka.enabled=true.
    bootstrap-servers: ${EXTRACTION_KAFKA_SERVERS:localhost:9092}
  datasource:
    # Same database the original backend targeted. Override via SPRING_DATASOURCE_* env vars.
    url: jdbc:sqlserver://localhost;databaseName=MoDocument;integratedSecurity=true;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        # Keep the exact PascalCase table/column names from the original schema.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    openai:
      # Bridged from the legacy aifiles.openai.* keys so AIFILES_OPENAI_* env
      # vars keep working. The "unset" sentinel lets the auto-configuration
      # boot without a key; AiFilesServiceImpl rejects LLM calls until a real
      # key is provided.
      api-key: ${aifiles.openai.api-key:unset}
      base-url: ${aifiles.openai.base-url:https://api.openai.com}
      chat:
        options:
          model: ${aifiles.openai.model-id:gpt-4o}

modocument:
  security:
    jwt:
      # HS256 signing key (must be at least 32 bytes). Override in production.
      secret: ${MODOCUMENT_JWT_SECRET:modocument-local-dev-secret-change-in-production-0123456789}
      ttl-hours: 24

aifiles:
  openai:
    # Set via AIFILES_OPENAI_APIKEY env var or an application-local.yml
    # (gitignored). Intentionally not defaulted here so the spring.ai bridge
    # above falls back to its "unset" sentinel when no key is configured.
    model-id: gpt-4o

docling:
  # Optional docling-serve endpoint (e.g. http://localhost:5001). When empty,
  # documents are parsed with the built-in readers (POI/CSV/PDFBox + OCR).
  base-url: ""

ocr:
  vision:
    # LLM vision OCR for standalone images and scanned PDF pages, tried before
    # the Tesseract fallback. Active only when an OpenAI key is configured
    # (see aifiles.openai above); without one it disables itself silently.
    enabled: ${OCR_VISION_ENABLED:true}
    model: ${OCR_VISION_MODEL:gpt-4o}
    # Vision-OCR page budget per PDF; pages beyond it fall back to Tesseract.
    max-pages: ${OCR_VISION_MAXPAGES:20}
    # Rasterization DPI for scanned pages and the longest image edge uploaded;
    # larger images are downscaled first (the upload size/cost control).
    dpi: 200
    max-dimension: 2048

extraction:
  # Where extraction data (sources, jobs, tasks, raw/processed records, audit)
  # lives: "mongo" for production scale, "memory" for local/test.
  store: ${EXTRACTION_STORE:mongo}
  kafka:
    # When enabled, task-available events are published to Kafka so any
    # instance in the consumer group can claim the task from the store. When
    # disabled, workers poll the store queue directly.
    enabled: ${EXTRACTION_KAFKA_ENABLED:false}
  worker:
    enabled: true
    threads: 4
    lease-seconds: 60
    poll-millis: 500
    shutdown-grace-seconds: 20
    max-attempts: 4
    backoff-millis: 5000
    sweep-millis: 15000
  batch-size: 500
  web:
    # Honest bot identity sent on every request; set the contact URL to a page
    # describing your crawler before extracting at scale.
    user-agent: "MoDocumentBot/1.0 (+https://example.com/bot)"
    default-delay-millis: 1000
    robots-ttl-seconds: 3600
    max-body-bytes: 5242880
    request-timeout-seconds: 20
    render-js-enabled: false
    max-pages-default: 100
    max-depth-default: 2

springdoc:
  swagger-ui:
    # Render the static, hand-maintained spec instead of a generated one.
    url: /swagger/spec.yaml

logging:
  level:
    root: info
