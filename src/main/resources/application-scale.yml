# Extraction at scale: combine with another profile (e.g. local or the default
# SQL Server setup) as SPRING_PROFILES_ACTIVE=local,scale. Switches the
# extraction store to MongoDB and distributes work over Kafka.
spring:
  autoconfigure:
    # Re-enable the Mongo/Kafka auto-configuration a base profile may exclude.
    exclude: []

extraction:
  store: mongo
  kafka:
    enabled: true
