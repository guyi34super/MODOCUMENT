spring:
  autoconfigure:
    # No Mongo/Kafka in tests: extraction uses in-memory adapters.
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:modocument-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    # Migrations are PostgreSQL-only; H2 gets its schema from ddl-auto: create.
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  ai:
    openai:
      # Dummy key so the Spring AI auto-configuration boots in offline tests;
      # no test ever calls the real API (the AiFilesService port is mocked).
      api-key: test-key

modocument:
  retention:
    # No scheduled purge racing deterministic tests; the ws14 retention gate
    # tests re-enable it (and drive the job explicitly) via test properties.
    enabled: false
  security:
    jwt:
      # Test-only signing key; production requires MODOCUMENT_JWT_SECRET.
      secret: modocument-local-dev-secret-change-in-production-0123456789
    permit-dev-paths: true
    maker-checker:
      # The broad H2 suite exercises the DIRECT template paths (the
      # documented config-off mode); MakerCheckerIntegrationTest turns the
      # template gate back on explicitly. User-security changes have no
      # such switch — they stay maker/checker-gated here too.
      template-changes: false
    ssrf:
      # The extraction end-to-end test crawls a loopback HTTP server, so the
      # SSRF egress guard (which blocks loopback) is off for the suite. The
      # guard itself is covered by OutboundHostPolicyTest.
      enabled: false

extraction:
  store: memory
  kafka:
    enabled: false
  worker:
    # Deterministic tests drive the queue/worker directly.
    enabled: false
