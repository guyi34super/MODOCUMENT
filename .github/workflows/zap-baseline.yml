name: ZAP baseline

# Gate E3/E1 evidence: a passive OWASP ZAP baseline scan against the real
# running stack (frontend nginx -> app -> PostgreSQL, exactly the
# trusted-proxy topology of docker-compose.yml). Known-acceptable alerts are
# tuned in .zap/rules.tsv — every IGNORE there carries a justification.
# Weekly plus on-demand (workflow_dispatch) for drills and release evidence.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Tuesday 05:37 UTC (off the hour to dodge scheduler congestion).
    - cron: '37 5 * * 2'

permissions:
  contents: read

concurrency:
  group: zap-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Boot compose stack (frontend + app + postgres)
        run: |
          # Ephemeral, run-scoped credentials: the stack lives only for this
          # job, nothing is persisted or published.
          export MODOCUMENT_JWT_SECRET="$(openssl rand -base64 48)"
          export MODOCUMENT_BOOTSTRAP_ADMIN_EMAIL="zap-scan@invalid.example"
          export MODOCUMENT_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -base64 24)"
          docker compose up -d --wait --wait-timeout 420 frontend
          docker compose ps

      - name: Smoke-check entry point
        run: curl -fsS -o /dev/null -w 'frontend answered %{http_code}\n' http://localhost:3000/

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          # Reports are uploaded as a run artifact (below / by the action);
          # issue writing would need `issues: write`, which this workflow
          # deliberately does not hold (SEC-042 least privilege).
          allow_issue_writing: false
          artifact_name: zap-baseline-report
          fail_action: true

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200 app frontend
