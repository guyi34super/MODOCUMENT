name: SBOM

# Gate E8 / SUP-S05: a CycloneDX SBOM is generated automatically for every
# release and for every push to main, and attached as a build artifact.
# Backend: cyclonedx-maven-plugin via the CI-only `sbom` profile (pom.xml) so
# local builds stay fast. Frontend: npm's built-in `npm sbom` (npm >= 10).

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Tests already gate merges in ci.yml; here we only need the resolved
      # dependency graph, so skip them.
      - run: mvn -B -DskipTests -Psbom package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-backend-${{ github.sha }}
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: error
          retention-days: 90

  frontend-sbom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm sbom --sbom-format cyclonedx --omit dev > bom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-frontend-${{ github.sha }}
          path: frontend/bom.json
          if-no-files-found: error
          retention-days: 90
