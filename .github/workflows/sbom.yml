name: SBOM

# Gate E8 / SUP-S05: a CycloneDX SBOM is generated automatically for every
# release and for every push to main, and attached as a build artifact.
# Backend: cyclonedx-maven-plugin via the CI-only `sbom` profile (pom.xml) so
# local builds stay fast. Frontend: npm's built-in `npm sbom` (npm >= 10).

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Tests already gate merges in ci.yml; here we only need the resolved
      # dependency graph, so skip them. connector-core is a sibling Maven
      # project: installed first, it appears in the BOM as the component
      # com.modocument:modocument-connector-core with its own dependencies.
      - run: mvn -B -q -f connector-core/pom.xml -DskipTests install
      - run: mvn -B -DskipTests -Psbom package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-backend-${{ github.sha }}
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: error
          retention-days: 90

  frontend-sbom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm sbom --sbom-format cyclonedx --omit dev > bom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-frontend-${{ github.sha }}
          path: frontend/bom.json
          if-no-files-found: error
          retention-days: 90
