name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore MoDocument.sln
      - run: dotnet build MoDocument.sln --no-restore -c Release
      - run: dotnet test MoDocument.sln --no-build -c Release --verbosity normal
