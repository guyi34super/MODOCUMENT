name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (SEC-042): CI only reads the repository. Actions are pinned
# by full commit SHA (supply-chain hardening, SUP-S05) with the tag as a
# comment; Dependabot's github-actions ecosystem keeps the pins fresh.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      # JaCoCo runs as part of verify (pom.xml); print the summary so the
      # coverage baseline is visible on every run. No threshold gate yet —
      # see docs/security/branch-protection.md ("Coverage gate").
      - name: Coverage summary
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR>1 {missed+=$4; covered+=$5} END {
              total=missed+covered;
              if (total>0) printf "JaCoCo instruction coverage: %.1f%% (%d/%d)\n", 100*covered/total, covered, total
            }' "$csv"
          else
            echo "jacoco.csv not found" && exit 1
          fi

  # Real-PostgreSQL integration suite (Flyway chain, RLS coverage, the C1
  # tenant-isolation gate). ubuntu-latest ships Docker, so the *PgIT classes
  # start a Testcontainers postgres:17; point MODOCUMENT_IT_JDBC_URL at an
  # external server to run them without Docker.
  backend-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify -Ppostgres-it

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
