# Dependabot (SEC-010 / SUP-S05 / gate E3): weekly update PRs across all five
# ecosystems, with minor+patch bumps grouped into one PR per ecosystem to keep
# review load sane. Version updates wait out a 7-day cooldown after a release
# (a freshly published package may be malicious or broken and is often
# yanked within days); security updates are not subject to the cooldown and
# always arrive individually and immediately regardless of the schedule.
# Majors stay ungrouped so breaking changes get their own review. Every Dependabot PR runs the full
# ci.yml + security.yml gauntlet before merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    # Covers /Dockerfile and /frontend/Dockerfile base images.
    directories:
      - /
      - /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  # ws20 Terraform (infra/terraform): AWS/random provider constraints in the
  # env root modules and the modules that pin providers themselves. Provider
  # bumps change the plan — every PR still needs a reviewed `terraform plan`
  # before apply.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/production
      - /infra/terraform/envs/staging
      - /infra/terraform/modules/backups
      - /infra/terraform/modules/edge
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      terraform-minor-patch:
        update-types:
          - minor
          - patch
