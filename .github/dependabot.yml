# Dependabot (SEC-010 / SUP-S05 / gate E3): weekly update PRs across all four
# ecosystems, with minor+patch bumps grouped into one PR per ecosystem to keep
# review load sane. Security updates always arrive individually and
# immediately regardless of the weekly schedule. Majors stay ungrouped so
# breaking changes get their own review. Every Dependabot PR runs the full
# ci.yml + security.yml gauntlet before merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    # Covers /Dockerfile and /frontend/Dockerfile base images.
    directories:
      - /
      - /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
