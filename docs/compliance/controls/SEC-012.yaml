question:
  final_answer: 'MoDocument''s roles follow bank job functions: Administrator (application owner and user administration), Approver (supervisor and four-eyes checker, who approves changes and releases reports but cannot author them), Read-write (operations staff who prepare data and reports) and Read-only (auditors and controllers). A bank maps its own job functions onto these roles through its identity provider. Each user holds exactly one role, so conflicting role combinations cannot be assigned at all; conflicting duties within a role (maker and checker of the same change, author and releaser of the same report) are separated per object and refused by the system. The role catalogue and conflict table are maintained with the code. Evidence SEC-012-E01.'
  confidence: High
