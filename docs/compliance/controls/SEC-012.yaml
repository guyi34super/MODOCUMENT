current_state: 'APPROVER role built. Role catalogue maps ADMIN (application owner / IT admin), APPROVER (supervisor / checker), READ_WRITE (operations / maker), READ_ONLY (auditor / controller) plus PLATFORM_ADMIN and API_CLIENT (docs/security/role-catalogue-and-sod.md). SoD conflict table is data in SodPolicy. A user holds exactly one role, so conflicting role pairs cannot be assigned; RoleAssignmentPolicy and a DB trigger refuse PLATFORM_ADMIN in a customer bank (live probe: 400). Banks map finer job functions through their IdP role claim.'
