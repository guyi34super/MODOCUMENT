current_state: 'Individual logins; joiner, mover and leaver are maker/checker in each bank''s Administration > Users; a role change replaces the role and kills outstanding tokens; a disabled account is inert immediately (token, refresh, password, SSO and MFA refused); BANK_CREATE requires at least one ADMIN and two ADMIN/APPROVER; user-list CSV export with last login and an access-review worksheet with inactive90d exist. Live probe: leaver token 401 and login 401 right after approval; mover token 200 while pending, 401 after, new role on sign-in. Not yet operated (pre-production).'
