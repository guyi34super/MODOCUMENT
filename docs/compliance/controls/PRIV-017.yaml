question:
  final_answer: 'Each bank''s administrator manages the bank''s own users in MoDocument, and every joiner, role change and leaver needs the approval of a second administrator or approver. New users must change their temporary password at first sign-in, and administrators must enrol multi-factor authentication. A role change replaces the old role and ends the person''s sessions immediately. A leaver''s account is unusable the moment the disable is approved: existing sessions, password login and single sign-on are all refused. New banks are onboarded with at least two administrators. Administrators can export the user list with last-login dates and produce a quarterly review worksheet that flags accounts unused for 90 days. MO Intelligence staff follow the same process inside a separate platform tenant with no access to client data. We verified the leaver and role-change behaviour on a running system; the first quarterly review will take place after go-live. Evidence PRIV-017-E01.'
  confidence: Medium
test:
  id: PRIV-017-T01
  actual_result: 'Leaver: existing token 401 and password login 401 immediately after the second admin''s approval. Mover: token 200 while pending, 401 after approval, new sign-in carries READ_WRITE. User-list CSV (with LastLoginAt) and access-review worksheet (7 accounts) produced. UserAdminIntegrationTest passed (10 tests).'
  result: Pass
  tester: Agent A4 (automated re-performance); human sign-off required
  date: 2026-10-19
