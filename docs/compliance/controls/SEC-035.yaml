question:
  final_answer: "MoDocument writes an append-only audit trail for every security-relevant action: the individual user (or machine client), their role, bank, session and IP address, the request ID, the time, the action and the affected record with its old and new values, and the outcome. Successful changes are recorded in the same database transaction as the change itself, so no change can commit without its audit record. The application's database role can only insert and read audit records, and database triggers refuse any update, delete or truncate, even by the table owner; an automated test on PostgreSQL proves both. Administrators and approvers can search, compare and export the trail in an audit viewer, and that access is itself audited. Records are kept for seven years. A database superuser could still bypass the triggers; to make such tampering detectable we are adding a hash chain over the records with a daily verification job before go-live (evidence SEC-035-E01)."
  confidence: High
test:
  id: SEC-035-T01
  actual_result: "Run R3 (2026-10-19): AuditAppendOnlyPgIT 5 tests, 0 failures (app role: insert only within its tenant, permission denied on UPDATE/DELETE/TRUNCATE; owner stopped by trigger; RLS covers the table). Run R1: 33 H2 audit tests, 0 failures. Run R4 drill: grants INSERT, SELECT only; triggers enabled; a superuser update with session_replication_role=replica succeeded (rolled back) and no verification exists to flag it. Part (a) Pass, part (b) Fail."
