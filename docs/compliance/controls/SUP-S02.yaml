id: SUP-S02
status: Partially Implemented
current_state: "HS256 access tokens of 15 minutes (5-15 setting) with minimal claims (sub, jti, roles, bank_id, token_ver); algorithm pinned in the decoder; 256-bit refresh tokens stored as SHA-256, rotated on every use with reuse detection that revokes the family; idle 12 h and absolute 7-day limits; revocation by jti denylist on logout and by TokenVersion on password change, admin reset, role change, disable, MFA reset and bank suspension (JwtService, RevocationValidator, AuthUseCase, V15)."
gap: "Tokens carry no iss/aud and are not audience-separated; one shared HS256 key without kid, so key rotation ends every session at once; access token kept in localStorage."
gap_type: Build
required_action: "Add iss/aud claims and validators; move to asymmetric keys with kid and an overlap window held in Secrets Manager/KMS; keep the access token in memory only."
