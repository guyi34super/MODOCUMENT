question:
  final_answer: "Yes. Privacy is part of how MoDocument is built and changed. Every pull request carries a privacy checklist (new personal-data fields classified, retention assigned, data-subject-request impact checked). Each template field is tagged with the kind of personal data it holds, and that tag drives role-based masking of national ID and account numbers on screens, reports and exports. Identifiers are replaced with placeholders before any AI processing, and a prompt that still contains one is blocked. Customer data is deleted automatically after 30 days, logs are redacted, and development and testing use synthetic data only. A data protection impact assessment covers document ingestion and document creation. Evidence: PRIV-004-E01."
  confidence: Medium
