question:
  final_answer: Privileged access is limited to a small named group and every grant is dual-controlled. In MoDocument, MO Intelligence's platform administrators sit in a dedicated platform tenant with no access to client data; there are always at least two, and each one's changes must be approved by the other. Each bank's administrators manage only their own bank, and every user or role change needs a second person's approval; self-approval is blocked by the system. Multi-factor authentication is mandatory for all administrators, and every privileged action is audited and raises an immediate alert. Cloud administration is held by the two named founders with root credentials sealed and alerted on use (to be confirmed with the infrastructure evidence). Separate administrator identities, the written grant record and the monthly privileged-activity review are being put in place, proposed for completion by 30 November 2026. Evidence SEC-017-E01.
  confidence: Medium
