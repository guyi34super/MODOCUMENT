  actual_result: 'Same records report: owner, APPROVER and ADMIN 200 with raw NIC; READ_ONLY 200 with ********; bank B ADMIN 404; PLATFORM_ADMIN 403. Export file 200 with no raw NIC. Dashboard isolation tests passed (3 H2 + 2 PostgreSQL).'
  result: Pass
