id: SEC-028
status: Partially Implemented
current_state: "Encryption inventory on the control page. At rest (Terraform, not applied): RDS storage and backups with a dedicated CMK (yearly rotation); S3 file store SSE-KMS with its own CMK enforced by bucket policy and named on every PUT by the app; log archive SSE-KMS with the AWS-managed key; Secrets Manager, CloudWatch, EBS and ECR with AWS-managed keys; AWS Backup vaults with no own CMK. Field level: TOTP seeds AES-256-GCM; connection secrets AES-256-GCM with per-bank HKDF keys; credentials only as Argon2id or SHA-256 hashes. In transit: CloudFront TLSv1.2_2021, ALB ELBSecurityPolicy-TLS13-1-2-2021-06, optional ALB mTLS, rds.force_ssl=1 plus sslmode=verify-full with the RDS CA in the image, S3 TLS-only bucket policy, HTTPS-only bank REST targets, pinned SFTP host keys, agent HTTPS with optional mTLS, HSTS. Not encrypted: ALB to ECS task (HTTP inside the VPC); bank DB targets may set sslmode=disable; agent to bank-internal APIs may use HTTP; alert webhook and SMTP TLS not enforced."
gap: "Infrastructure not deployed, so the SSL Labs grade and pg_stat_ssl check cannot be produced; ALB to task hop is plain HTTP; backup vaults and log archive have no separate CMK; TLS to bank databases, alert webhooks and SMTP not enforced."
gap_type: Build
required_action: "Add TLS between the ALB and the containers (or a written acceptance); own CMKs with explicit key policies for backup vaults, log archive and CloudWatch; refuse non-TLS bank DB targets, webhooks and SMTP in deployed environments; at go-live run an SSL Labs scan and record pg_stat_ssl for app sessions."
