question:
  final_answer: "All MoDocument data stores are encrypted at rest: the PostgreSQL database and its automated backups with a dedicated, yearly-rotated KMS key; the document file store (S3) with its own KMS key enforced by bucket policy; logs, secrets and server disks with AWS-managed keys. Credentials stored by the application are additionally encrypted field by field with AES-256-GCM (MFA seeds; bank connection secrets with a separate key per bank) or stored only as Argon2id/SHA-256 hashes. In transit, users and bank systems reach MoDocument over TLS 1.2 or 1.3 only (optionally with mutual TLS for bank systems); the application connects to the database over TLS that the server enforces and the client verifies against the AWS certificate authority; file transfers use HTTPS or SFTP with a pinned host key. MoDocument is pre-production and the infrastructure is defined as code but not yet deployed, so the external TLS grade and the live database TLS check will be produced at go-live. Two hardening items are planned before go-live: TLS between the load balancer and the application containers, and dedicated keys for the backup vaults and log archive (evidence SEC-028-E01)."
  confidence: Medium
