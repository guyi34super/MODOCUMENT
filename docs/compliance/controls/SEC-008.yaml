question:
  final_answer: "MoDocument has a documented stress test plan and a stress testing report. The test was run on 19 October 2026 with synthetic data only, on a pre-production test environment (one application instance, production configuration with row-level security, a 4-vCPU machine, plus a run pinned to one CPU to approximate one production task). It covered concurrent data entry, concurrent report generation, large templates (300-field PDF forms, 50,000-row files), a peak user mix at 1x, 2x and 4x an assumed peak of 50 concurrent users, a 10-minute soak, overload behaviour (rate limits, AI outage, database pool saturation) and a breakpoint search. Results: 0 errors at 1x and 2x peak with p95 latency below 60 ms for interactive requests; one instance on 4 CPUs sustained about 715 requests per second within the latency thresholds and reached its latency breaking point at 400 concurrent fast-clicking users, with no errors; the machine's CPU was the bottleneck. Nine findings (none critical) have owners and dates. Raw outputs are archived with the report. Before go-live the same plan is re-run on the staging environment at 2x the confirmed peak, and the report is re-issued at least every 12 months and after major architecture changes. Evidence: SEC-008-E01."
  confidence: Medium
test:
  id: SEC-008-T01
  actual_result: "Plan executed 2026-10-19 in four runs (main, default-limits, one-cpu, retest-s5b); report dated 2026-10-19 states the tested capacity (300 users, about 715 req/s within thresholds on 4 shared CPUs) and the breaking point (400 users, latency); 0 errors in all capacity scenarios; raw outputs archived under perf/results/stress-2026-10/. Not yet run on production-sized staging infrastructure."
