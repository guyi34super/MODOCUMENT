question:
  final_answer: "Yes. Every API call to MoDocument is protected in layers. Traffic is encrypted with TLS 1.2 or 1.3 only. Every call must be authenticated: people use short-lived, revocable tokens issued by MoDocument (with MFA for administrators); bank systems use OAuth 2.0 client credentials, an API key or mutual TLS, each with limited scopes, an optional IP allow-list, an expiry and immediate revocation. Each operation checks the caller's permission, and every query is limited to the caller's own bank by database row-level security. Inputs are validated and size-limited, calls are rate-limited per user and per client, write calls from bank systems are idempotent, and the webhooks MoDocument sends are signed with HMAC-SHA256 and a timestamp so the bank can reject forgeries and replays. Evidence: SEC-007-E01."
  confidence: High
