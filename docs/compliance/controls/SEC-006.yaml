question:
  final_answer: "MoDocument exposes REST APIs with JSON payloads, described by an OpenAPI 3.1 specification that is generated from the code and checked automatically on every build. There are three API families: the user API behind the web application (bearer tokens), a versioned integration API for bank systems (/api/integration/v1, with OAuth 2.0 client credentials, API keys or mutual TLS), and a versioned protocol for the optional on-premises Connector Agent (/api/agent/v1). MoDocument can also call the bank's systems through REST, database and SFTP connectors, and sends signed webhooks (HMAC-SHA256). A written versioning policy keeps a published path stable within a version and gives at least six months' notice before a route is removed. A sandbox access process is defined; the sandbox environment is set up before the first external integrator starts. Evidence: SEC-006-E01."
  confidence: High
test:
  id: SEC-006-T01
  actual_result: "2026-10-19 H2 run: OpenApiContractTest 7/7, ApiDocsExposureTest 3/3, DeprecatedEndpointsTest 3/3, RoutePermissionCoverageTest 2/2, IntegrationApiTest 7/7, IntegrationAgentApiTest 6/6; 0 failures. Sandbox acceptance not run (no sandbox deployed)."
