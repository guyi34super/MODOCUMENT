id: SUP-S13
status: Partially Implemented
current_state: "Every model call goes through AiGateway (build guard and Semgrep rule forbid other use). PiiTokenizer replaces sensitive values with tokens before the prompt and detokenizes locally; the assembled prompt is re-scanned and blocked on raw NIC, account or e-mail shapes; tenant guard enforces one bank per prompt; every completion is output-scanned (strict reject or lenient scrub); local Ollama endpoint by default, external only by explicit configuration; vision OCR off by default; per-bank ai.enabled switch (SECURITY tier, maker/checker); per-user LLM quota 60/h; circuit breaker with timeouts and code fallback; bank-scoped AI result cache under RLS; prompts and completions never logged. Design note docs/security/ai-controls.md updated 2026-10-19. Technical tests pass. Open: written acceptance of the four residual risks (C11); production model location and any external provider settings undecided."
