current_state: "Deploys use GitHub OIDC to a per-environment AWS role (ci-oidc module, not applied); no static cloud keys in any workflow; least-privilege deploy role (ECR push, ECS deploy, PassRole to task roles only); immutable ECR tags with scan on push; images built once and deployed by digest; build separated from staging and production deploy, production behind environment reviewers; 58 of 58 external actions pinned by full commit SHA; read-only default token permissions; pull_request only (no pull_request_target) on GitHub-hosted runners; Dependabot for Actions, Maven, npm, Docker and Terraform. Gaps: staging OIDC trust is repo:<repo>:* (any ref); no provenance attestation (buildx --provenance=false); documented branch protection not enforced (PRs #63 to #66 merged with failed checks and no review); GitHub Actions has started no job since 2026-10-16."
