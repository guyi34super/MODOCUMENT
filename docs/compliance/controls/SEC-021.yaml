  id: SEC-021-T01
  actual_result: "2026-10-19 H2 run: PasswordPolicyTest 8/8 (Password123 and e-mail local part rejected, minimum length enforced and configurable), AccountLockoutIntegrationTest 2/2 (sixth wrong attempt locks, backoff doubles), LoginLockoutPolicyTest 4/4, KeycloakRealmConfigTest 6/6; 0 failures."
