  location: "docs/compliance/controls/SEC-021.md; src/main/java/com/modocument/application/security/PasswordPolicy.java; src/main/resources/security/common-passwords.txt; docs/compliance/evidence/A6-test-runs.md"
question:
  final_answer: "Yes. MoDocument enforces a password policy based on NIST SP 800-63B for every password it holds: at least 12 characters (each bank can raise this up to 128), long passphrases allowed, and rejection of passwords on a built-in list of common and breached passwords and of passwords that contain the user's own e-mail name. After five wrong attempts the account locks, for 1 minute at first and doubling up to 30 minutes; each bank can tune these values within fixed limits. Users who sign in through Keycloak get the same minimum length plus username and e-mail checks; users who sign in through Microsoft Entra ID follow their bank's Entra password policy. Evidence: SEC-021-E01."
  confidence: High
