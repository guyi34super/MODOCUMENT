id: SEC-021
status: Partially Implemented
current_state: "PasswordPolicy applies everywhere a password is set: minimum 12 characters (bank setting 12-128), passphrases accepted, breached/common list check (common-passwords.txt, 11,384 entries) and e-mail local-part check; lockout after 5 wrong attempts (3-10) with 1-minute lock doubling to 30 minutes; 30/address and 10/account sign-in attempts per 15 min. Keycloak realm: length(12), notUsername, notEmail, brute-force protection."
gap: "Breached list is a local 11,384-entry list (no k-anonymity lookup); Keycloak realm has no breached-password list; no optional password-history rule."
gap_type: Build
required_action: "Extend the breached list or add a k-anonymity lookup; add passwordBlacklist to the Keycloak realm; add password history only if a bank policy requires it."
