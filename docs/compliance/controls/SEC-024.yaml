question:
  final_answer: MoDocument enforces separation of duties in the system at three levels. At assignment, each user holds exactly one role, so conflicting roles cannot be combined, and role changes need a second administrator's approval. At runtime, whoever prepares or submits a report can never release it, even if they also hold the Approver or Administrator role, and whoever requests a change can never approve it; these attempts are refused and recorded in the audit trail. Every night a scan re-checks all released reports and applied changes and raises an alert if any was released or approved by its own author. Automated tests demonstrate all three levels, and we confirmed the runtime refusals on a running system. Evidence SEC-024-E01.
  confidence: High
