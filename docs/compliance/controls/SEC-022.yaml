id: SEC-022
status: Partially Implemented
current_state: "Built-in TOTP (RFC 6238, 6 digits, 30 s, +/-1 step), secret AES-256-GCM at rest, last accepted step stored so replays fail, 5 attempts/user/min; MFA challenge 5 min, access token 15 min, refresh idle 12 h / absolute 7 days, agent enrolment token 15 min, webhook 5-min replay window; Keycloak realm TOTP enforced. No e-mail/SMS OTP or reset links exist."
