  status: Complete
  location: "docs/compliance/controls/SEC-022.md; docs/compliance/policies/token-and-otp-specification.md; docs/compliance/evidence/A6-test-runs.md"
question:
  final_answer: "Yes. MoDocument has built-in time-based one-time passwords (TOTP, RFC 6238: 6 digits, 30-second step, one step of clock tolerance). An accepted code can never be used again, and code checks are rate-limited per user and per network address. Every other code or token MoDocument issues has a fixed lifetime: the MFA sign-in challenge expires after 5 minutes, access tokens after 15 minutes, sessions after 12 hours idle or 7 days at most, and one-time enrolment tokens after 15 minutes. MoDocument does not send e-mail or SMS codes or password-reset links. Bank users who sign in through Microsoft Entra ID or Keycloak receive their one-time codes from that provider. Evidence: SEC-022-E01."
  confidence: High
test:
  id: SEC-022-T01
  actual_result: "2026-10-19 H2 run: TotpTest 6/6, MfaUseCaseTest 10/10 (replayed code refused, stale challenge refused), MfaFlowIntegrationTest 6/6 (rate limit after five attempts), MfaRateLimiterTest 4/4, AuthFlowIntegrationTest 10/10 (expired and idle sessions refused), AgentEnrolmentTokenTest 4/4, WebhookIntegrationConnectorTest 5/5 (stale timestamp refused); 0 failures. Temporary passwords have no expiry."
  result: Partial
  tester: "Agent A6 (automated re-performance); human sign-off required"
  date: 2026-10-19
