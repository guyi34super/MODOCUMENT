  id: SEC-014-T01
  actual_result: "2026-10-19 H2 run: MfaFlowIntegrationTest 6/6 (admin without MFA must enrol before any token; no token until the code verifies), MfaUseCaseTest 10/10, AuthUseCaseTest 37/37, KeycloakRealmConfigTest 6/6, OidcLoginServiceTest 18/18, OidcLoginSuccessHandlerTest 2/2, OidcRegistrationFactoryTest 5/5, AuthProvidersConfiguredTest 3/3; 0 failures. Review: no step-up, no amr/acr check on OIDC, compose default admin MFA false."
