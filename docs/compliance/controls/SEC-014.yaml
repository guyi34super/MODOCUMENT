  status: Partial — to collect
  location: "docs/compliance/controls/SEC-014.md; docker/keycloak/modocument-realm.json; application-oidc.yml.example; docs/security/identity-providers.md; docs/compliance/evidence/A6-test-runs.md"
question:
  final_answer: "Yes. MoDocument has built-in multi-factor authentication with authenticator-app one-time codes (TOTP) and one-time recovery codes. A second factor is mandatory for bank administrators and for the platform owner's accounts, and each bank can make it mandatory for all its users; a password alone never produces a session for these accounts. MoDocument also supports single sign-on through OpenID Connect with Microsoft Entra ID and Keycloak. On that path the identity provider enforces MFA: through the bank's Entra Conditional Access policy, or through the Keycloak realm, which requires every user to enrol an authenticator. Evidence: SEC-014-E01."
  confidence: Medium
