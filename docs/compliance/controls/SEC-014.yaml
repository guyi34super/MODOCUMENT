id: SEC-014
status: Partially Implemented
current_state: "Built-in TOTP MFA with recovery codes and two-phase sign-in; PLATFORM_ADMIN always needs TOTP; ADMIN needs TOTP (security.mfa.requireForAdmins locked true, yml default true); other roles when the bank sets security.mfa.requireForAllRoles. OIDC SSO with Entra ID and Keycloak (bridge pattern); Keycloak realm forces TOTP enrolment; Entra MFA via the bank's Conditional Access; MFA reset is maker/checker."
