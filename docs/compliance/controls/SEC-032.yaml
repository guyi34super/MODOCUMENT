question:
  final_answer: "Security alerts are raised in real time from the audit trail by 26 configurable rules, including repeated failed logins per account and per address, account lockouts, refresh-token replay, privileged role and MFA changes, self-approval attempts, separation-of-duties violations, blocked and large exports, bursts of denied access, API-client authentication failures and platform changes. Thresholds and windows are configuration and can be tuned by administrators under four-eyes approval. Single-event rules fire immediately and threshold rules are evaluated every minute; in our automated test run of 19 October 2026, every tripped immediate rule was raised within 0.2 seconds and delivered to its channels within 0.4 seconds. Alerts are recorded with their delivery evidence and sent to the log, a webhook and e-mail. Routing of high-severity alerts to the on-call phone, with a written on-call and escalation policy, is being completed by 30 October 2026. Evidence SEC-032-E01."
  confidence: Medium
test:
  id: SEC-032-T01
  actual_result: "Alerting tests pass (2026-10-19). 11 immediate alerts raised within 108 ms and accepted by log and test-webhook channels within 346 ms; 12 windowed alerts raised when the tests ran the sweep (AlertingGateD1Test asserts under 5 minutes; production worst case one 60 s sweep plus delivery). 10 of 26 rules tripped end to end. No person's phone or mailbox in the loop."
