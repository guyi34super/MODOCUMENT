id: SEC-032
status: Partially Implemented
current_state: "26 alert rules over the append-only audit trail are configuration (modocument.alerts.rules), validated at startup and pinned by AlertRuleCatalogueTest; thresholds and windows of windowed rules are also maker/checker platform settings. Immediate rules fire after commit; windowed rules every 60 s. Alerts are stored in AlertLog with delivery evidence (ALERT_SENT) and shown under Administration > Security alerts. Channels: log, webhook (phone path), e-mail. No receiver is configured and the ECS task definition passes no alert variables. Test run 2026-10-19: 11 immediate alerts raised within 108 ms and accepted by channels within 346 ms; 10 of 26 rules tripped end to end. Escalation policy drafted."
gap: "No phone path (no webhook receiver, alert variables missing from the ECS task); 16 of 26 rules without a trip test; some workbook catalogue items not built (new country, off-hours privileged use, new egress destination, canary rows, AWS root use); escalation policy not approved."
gap_type: Config
required_action: "Connect an on-call relay and pass MODOCUMENT_ALERTS_* in the ECS task; trip a HIGH rule in staging and out of hours with a written record; add trip tests for untested rules; decide the missing catalogue items; approve the escalation policy."
action_owner: "Security — Bhavish Nobeen"
