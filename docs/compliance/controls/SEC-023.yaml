question:
  final_answer: 'Critical changes in MoDocument always need two different people: user creation, role changes, account disabling, password and MFA resets, template changes and deletions, security settings, integration connections, outbound data flows, API clients and connector agents, and every platform-level change such as onboarding or suspending a bank. The change is held as pending, with no effect, until a different authorised user approves it. If the requester tries to approve their own change, the system returns an error and records the attempt in the audit trail; this applies to administrators too. Every bank is created with at least two administrators or approvers so a second approver is always available. We verified this on a running system. Evidence SEC-023-E01.'
  confidence: High
