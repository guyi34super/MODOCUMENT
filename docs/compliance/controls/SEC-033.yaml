id: SEC-033
status: Partially Implemented
current_state: "Pre-production; Terraform validated, not deployed. S3 log archive with Object Lock enabled, versioning, SSE-KMS, lifecycle to Glacier after 90 days and expiry at 2557 days; COMPLIANCE 7-year default retention only when enforce_backup_locks = true (off by default). CloudTrail (multi-region, log-file validation) and Session Manager logs go to the archive; CloudTrail kept 400 days hot (min 365 enforced). AuditEvent is append-only in PostgreSQL and never purged by the app, but has no archived copy. App logs 90 days, flow logs 30 days, RDS log retention unset, no WAF/ALB/CloudFront logs. Rehydration runbook written, never run."
