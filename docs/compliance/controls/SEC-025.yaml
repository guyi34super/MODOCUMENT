  id: SEC-025-T01
  actual_result: "Run R1 (2026-10-19): 197 change-management, settings and audit-viewer tests, 0 failures. Release 1.2.0 traced via git and the GitHub API: request (PR #32), author, time, tests and changelog retrievable; no review recorded and no deployment record (no tag, no release run). Last six merges (#32, #62 to #66) have 0 reviews; #63 to #66 merged with every check failed because GitHub Actions started no job."
