question:
  final_answer: "Every security event is recorded once, in an append-only audit trail, and exported to the bank's SIEM as structured JSON using Elastic Common Schema field names, with a published field reference and a field-stability promise. A bank's SIEM can pull its events over HTTPS with cursor-based paging, or receive them by signed HTTPS push. Each bank's feed contains only that bank's events: this is enforced by the bank identity in the access token and by database row-level security, and verified by an automated two-bank test. An end-to-end validation with a reference SIEM (Elastic or Splunk) is scheduled for 30 November 2026. Syslog and CEF delivery are not offered today. Evidence SEC-031-E01."
  confidence: Medium
