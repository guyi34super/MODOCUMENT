id: SEC-031
status: Partially Implemented
current_state: "Security events come from one source, the append-only audit trail, rendered as ECS 8.11 JSON by one serializer (SiemEventMapper). The schema is documented in docs/security/siem-event-schema.md and pinned to the serializer by SiemFeedE6Test. Transports: HTTPS pull feed GET /api/siem/events (siem:read, ADMIN, bank taken from the token, RLS) with cursor paging; optional signed NDJSON push for one bank; structured ECS logs with the structured-logs profile. Tenant scoping proven by a two-bank test (SiemFeedE6Test, 6 tests pass 2026-10-19). No syslog/CEF transport; no reference-SIEM test; the ECS task does not enable structured logs or the push."
gap: "No reference-SIEM ingestion test; ECS task definition does not enable structured logs or SIEM push; no syslog/CEF transport."
gap_type: Build
required_action: "Run a reference SIEM (Elastic or Splunk) against a staging feed and measure login-failure latency; enable structured-logs in ECS; decide on syslog/CEF."
