id: SEC-029
status: Partially Implemented
current_state: "Written crypto standard (docs/security/crypto-standard.md, updated 2026-10-19): AES-256-GCM with 96-bit nonce and 128-bit tag through one primitive (AesGcm), HKDF-SHA256 per-bank keys for connection secrets, Argon2id for passwords and API-client secrets, HMAC-SHA256 signatures, JWT HS256 with an RS256 plan, SHA-256 digests. TLS policy names in Terraform: CloudFront TLSv1.2_2021, ALB ELBSecurityPolicy-TLS13-1-2-2021-06, origin TLSv1.2 https-only, RDS force_ssl plus verify-full. Two KMS CMKs (RDS, file store) with yearly rotation; no explicit key policies. Semgrep rules against MD5, SHA-1, DES, ECB and weak MACs run with --error in security.yml; 0 findings on 2026-10-19."
gap: "No explicit KMS key policies; backups and logs use AWS-managed keys; SSL suite scan impossible until deployment; the Semgrep rule is not enforced while GitHub Actions is down; standard not approved."
