  final_answer: "MoDocument is not yet in production and holds no bank data. At go-live, all data will be stored in AWS Cape Town (af-south-1): the database in Amazon RDS for PostgreSQL across two availability zones, and documents in Amazon S3, both encrypted with dedicated KMS keys. The database has continuous backups with point-in-time recovery for 35 days, and daily backups kept 90 days in AWS Backup with an encrypted copy in a second AWS region (Sydney). Document files are versioned; an off-site backup copy for them is being added before go-live. Our recovery targets are an RPO of 5 minutes within the region and 24 hours for loss of the region. Restores have not been tested yet because nothing is deployed; a timed restore drill on the deployed system is a go-live condition and will then run quarterly. The full storage map is provided. Evidence: PRIV-006-E01."
