evidence:
  id: SEC-011-E01
  status: Complete
  location: docs/compliance/controls/SEC-011.md; docs/security/role-permission-matrix.csv; src/main/java/com/modocument/api/security/PermissionChecker.java; src/test/java/com/modocument/api/security/RoutePermissionCoverageTest.java; docs/compliance/evidence/A4-route-permission-inventory.md; docs/compliance/evidence/A4-rbac-probe.md
question:
  final_answer: MoDocument uses role-based access control enforced on the server. Each user holds exactly one of four bank roles (Administrator, Approver, Read-write, Read-only); MO Intelligence staff use a separate platform role that cannot see any bank's data; machine integrations use a client role limited to the scopes granted to each client. The 41 permissions take the form resource:action. Every API route requires exactly one permission, checked in a single authorisation component, and an automated test fails the build if any route is left unmapped. The role-permission matrix is version-controlled as code, and a second test fails the build if the published matrix and the code differ. Below the permission layer, database row-level security confines each user to their own bank. We verified enforcement by calling each role's routes on a running system. Evidence SEC-011-E01.
  confidence: High
test:
  id: SEC-011-T01
  actual_result: 'RoutePermissionCoverageTest and RolePermissionMatrixTest passed; 238 of 245 routes carry exactly one permission, 7 are the public allowlist; live probe on the production-profile stack: 352/352 role x route calls matched the matrix (126 allowed, 182 denied 403, 44 anonymous 401).'
