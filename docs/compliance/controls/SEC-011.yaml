id: SEC-011
status: Fully Implemented
current_state: 'RBAC with 6 roles and 41 resource:action permissions. Grants are code (RolePermissions) rendered to docs/security/role-permission-matrix.csv and pinned by RolePermissionMatrixTest. One central check: @RequiresPermission evaluated by PermissionChecker (deny by default, platform-bank guard, API-client scope narrowing). RoutePermissionCoverageTest fails the build on any unmapped route; 238 of 245 routes carry a permission, 7 are the public allowlist. PostgreSQL RLS and owner scoping below the permission layer. Live probe: 352/352 role x route calls matched the matrix.'
gap: 'None in the product. Organisational: retire the shared pre-production team account; hold the first quarterly matrix review.'
gap_type: Org
required_action: Confirm the shared account is deleted and every team member uses an individual login; hold the quarterly matrix review together with the access review.
action_owner: Software Engineering — Bhavish Nobeen
