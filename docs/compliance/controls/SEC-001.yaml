question:
  final_answer: "MoDocument is a hybrid system. The application, API, database and file store run on AWS in Cape Town (af-south-1) across two availability zones, all defined in Terraform. Users reach it through Amazon CloudFront with AWS WAF and Shield Standard; the load balancer accepts traffic only from CloudFront; the application runs as non-root containers on ECS in private subnets; the PostgreSQL database is in private subnets with no internet route and accepts only TLS connections from the application. Banks that integrate their own systems may run our Connector Agent on their premises; it only makes outbound HTTPS connections. MoDocument is pre-production: the environment is written and validated as code but not yet deployed. The architecture diagram, the Terraform reference and the control at each hop are provided. Evidence: SEC-001-E01."
  confidence: Medium
