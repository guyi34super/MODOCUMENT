question:
  final_answer: "MoDocument is not yet in production. At go-live it will run in two AWS availability zones in Cape Town: the PostgreSQL database uses Amazon RDS Multi-AZ with a synchronous standby and automatic failover; the application runs at least two containers on at least two servers spread across both zones behind a load balancer with health checks; each zone has its own outbound NAT gateway. For loss of the whole region, the database backup is copied daily to a second AWS region (Sydney) and kept 90 days; recovery from a region loss means rebuilding the environment from our infrastructure code and restoring that copy, so it is a restore, not an automatic failover. A zone-failure test will be run before go-live. Evidence: SEC-004-E01."
