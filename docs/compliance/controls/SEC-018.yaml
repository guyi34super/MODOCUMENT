question:
  final_answer: "Yes. MoDocument keeps no plaintext credential at rest. User passwords for MoDocument's own sign-in are stored only as salted Argon2id hashes; users who sign in through Microsoft Entra ID or Keycloak have no MoDocument password. System credentials (token-signing key, encryption keys, database credentials) are held in AWS Secrets Manager and injected into the running service at start-up; they are never in source code, images or configuration files. Credentials for a bank's own systems are encrypted with a per-bank key. A secret scan over the full repository history finds no secrets. Evidence: SEC-018-E01."
