question:
  final_answer: "Yes, for access, portability and erasure; rectification uses the normal editing functions. On the bank's instruction, a bank administrator can search all of MoDocument's stores for one person (by national ID, account number, e-mail or name), export everything found as a machine-readable JSON file plus a readable text copy, and erase it. Erasure reaches the uploaded files, extracted rows, generated documents, the searchable record index and caches; a repeated search returning nothing is the closure evidence, and every step is audited without recording the person's identifier. Restriction and objection are handled by the bank stopping or deleting the processing; there is no separate switch. Backups that still hold erased data expire within 90 days and are re-erased if ever restored. All customer data is deleted automatically after at most 30 days. Evidence: PRIV-013-E01."
  confidence: Medium
