question:
  final_answer: "MoDocument is not yet in production and holds no bank data. Its AWS environment is defined in code and will be deployed before go-live with: Amazon GuardDuty threat detection on the account, with findings sent to the on-call team; database backups taken daily, kept 90 days and copied to a second AWS region; and an AWS Backup vault lock that, once enabled, stops anyone, including our own administrators, from deleting or shortening recovery points. Two items are still open before go-live: enabling GuardDuty runtime and malware protection, and adding a locked backup copy for the document file store. Endpoint protection for staff laptops will be in place before go-live. We will prove recoverability with a timed full restore to an isolated environment before bank data is accepted. Evidence: PRIV-003-E01."
