current_state: "Pre-production; Terraform validated, not deployed. RDS in private DB subnets with no internet route, publicly_accessible false, DB security group ingress 5432 from the app SG only and no egress. rds.force_ssl = 1; app connects with sslmode=verify-full against the baked RDS CA bundle. Parameter group logs DDL, connections and disconnections. Master password held by RDS in Secrets Manager. Runtime role modocument_app is NOBYPASSRLS with DML-only grants (V12), UPDATE/DELETE/TRUNCATE revoked on AuditEvent (V14), RLS enforced on every BankId table (afterMigrate). Gaps: the app task also holds the master (Flyway) credentials; no human access path; log-archive bucket has no TLS-only deny; no vault access policy."
