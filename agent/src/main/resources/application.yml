# MoDocument Connector Agent — every value comes from the environment
# (agent/README.md "Configuration"). No web server: the agent has no
# inbound port.
spring:
  application:
    name: modocument-agent
  main:
    web-application-type: none
    banner-mode: off

modocument:
  agent:
    url: ${MODOCUMENT_URL:}
    enrolment-token: ${MODOCUMENT_ENROLMENT_TOKEN:}
    name: ${MODOCUMENT_AGENT_NAME:}
    state-dir: ${MODOCUMENT_AGENT_STATE_DIR:/var/lib/modocument-agent}
    allow-list: ${MODOCUMENT_AGENT_ALLOWLIST:/etc/modocument-agent/allowlist.yml}
    secrets-dir: ${MODOCUMENT_SECRETS_DIR:/etc/modocument-agent/secrets}
    poll-wait-seconds: 30
    heartbeat: 30s
    max-backoff: ${MODOCUMENT_AGENT_MAX_BACKOFF:5m}
    allow-insecure-http: ${MODOCUMENT_ALLOW_INSECURE_HTTP:false}

logging:
  level:
    root: INFO
    # Drivers and SSH are chatty at INFO; nothing of theirs carries secrets
    # at WARN.
    org.apache.sshd: WARN
